# =============================================================================
# Plik: .cargo/config.toml
# Opis: Globalne ustawienia buildu dla calego projektu TentaFlow. Cargo szuka
#       tego pliku idac w gore drzewa od CWD przy `cargo build` — jest brany
#       pod uwage z kazdego sub-crate'u (tentaflow/, tentaflow-core/, itp.)
#       Wersje zależności i profile znajdują się w głównym Cargo.toml.
# =============================================================================

[build]
# Wspoldzielony katalog buildowy dla WSZYSTKICH crate'ow w repo. Bez tego
# kazdy sub-crate (tentaflow/, tentaflow-core/, tentaflow-protocol/, ...)
# ma wlasny `target/` z pelna kopia deps — ~230 GB lacznie. Z jednym
# target_shared/ deps sa kompilowane raz i reuzywane. Sciezka relatywna,
# resolvowana wzgledem katalogu zawierajacego `.cargo/` (czyli repo root).
target-dir = "target_shared"

# `jobs` celowo nieustawione — Cargo automatycznie wykrywa wszystkie logiczne
# CPU (`std::thread::available_parallelism`). Maszyny zespolu maja rozne
# liczby rdzeni (10/16/32/...), hardcode bil maszyny z >8 CPU. Override
# per-machine przez ENV: `export CARGO_BUILD_JOBS=N` w shell rc, albo
# inline: `cargo build --jobs N`.

# Incremental NIE wymuszany globalnie. W [build] wlaczal incremental TAKZE dla
# release (target_shared/release/incremental ~12 GB bez korzysci — release nie
# iteruje plik-po-pliku). Bez tej linii Cargo stosuje domyslne per-profil:
# dev/test oraz release-fast = incremental ON; release/bench = OFF.
# Ustawienia profili są w root Cargo.toml. Override per-build: CARGO_INCREMENTAL=0/1.

# sccache jest opcjonalnym wrapperem instalowanym lokalnie.
# Limit obowiązuje serwer uruchomiony przez Cargo; już działający serwer
# zachowuje konfigurację startową. Procedura zmiany: docs/build-performance.md.
[env]
SCCACHE_CACHE_SIZE = { value = "20G", force = true }

# Linker jest wybierany przez toolchain platformy. Rust od 1.90 używa LLD
# domyślnie dla x86_64-unknown-linux-gnu; pozostałe targety mają własne domyślne
# ustawienia. Porównanie z mold wymaga pomiaru czasu właściwego linkera i LTO.
# Lokalny eksperyment można wykonać przez --config, bez wpisywania do repo
# ścieżki linkera konkretnej maszyny.

# =============================================================================
# Network: Cargo registry / git fetching
# =============================================================================
# Sparse protocol dla crates.io — pobiera tylko zalezne crate'y zamiast
# klonowac calej registry. Domyslnie wlaczone od Rust 1.70+ ale upewniamy
# sie ze nie ma jakies nadpisanie z innego config'a wyzej w drzewie.
[registries.crates-io]
protocol = "sparse"

# Wiecej rownoleglych pobierania crate'ow przy pierwszym `cargo fetch`.
[net]
retry = 3
git-fetch-with-cli = true
