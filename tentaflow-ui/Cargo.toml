[package]
name = "tentaflow-ui"
version = "0.1.0"
edition = "2021"
description = "TentaFlow UI — wspolna biblioteka GUI (egui + wgpu)"

[dependencies]
# GUI
egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "default_fonts"] }
egui_extras = { workspace = true, features = ["image"] }

# Serialization (do komunikacji z Core)
serde = { workspace = true, features = ["derive"] }

# Async (komunikacja z Core w background)
tokio = { workspace = true, features = ["sync", "rt"] }

# Utils
chrono = { workspace = true, features = ["serde"] }
