[package]
name = "tentaflow-cli"
version = "0.1.0"
edition = "2021"
description = "TentaFlow narzedzie wiersza polecen (validate manifestu addonow, F1c packaging)"

[[bin]]
name = "tentaflow-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tentaflow-core = { workspace = true, features = ["camera"] }
chrono = { workspace = true }
rand = { workspace = true, default-features = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true, default-features = true }
