# =============================================================================
# Plik: Cargo.toml
# Opis: Manifest crate'a z własnymi wrapperami TentaFlow dla natywnych silników.
# =============================================================================

[package]
name = "tentaflow-wrappers"
version = "0.1.0"
edition = "2021"
description = "Własne wrappery TentaFlow dla llama.cpp, whisper.cpp i kolejnych natywnych silników"

[features]
default = []
llama = ["dep:llama-cpp-sys-2"]
whisper = ["dep:whisper-rs-sys"]
sherpa = ["dep:sherpa-rs-sys"]
all = ["llama", "whisper", "sherpa"]

[[example]]
name = "llama_smoke"
required-features = ["llama"]

[[example]]
name = "llama_engine_smoke"
required-features = ["llama"]

[[example]]
name = "seq_rm_probe"
required-features = ["llama"]

[[example]]
name = "gpu_pin_test"
required-features = ["llama"]

[[example]]
name = "whisper_smoke"
required-features = ["whisper"]

[dependencies]
encoding_rs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
thiserror = { workspace = true }
llama-cpp-sys-2 = { workspace = true, optional = true }
sherpa-rs-sys = { workspace = true, optional = true }

# whisper.cpp NIE istnieje na Apple: tam STT idzie przez MLX-whisper. Wpis jest
# odciety targetem, wiec feature `whisper` wlaczony na macOS/iOS nie ma czego
# zaciagnac i jest no-opem — platformowy warunek pilnuje build system, a nie
# pamiec tego, kto sklada liste features.
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
whisper-rs-sys = { workspace = true, optional = true }
