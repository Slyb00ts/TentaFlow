[package]
name = "tentaflow-core"
version = "0.1.0"
edition = "2021"
description = "TentaFlow Core — wspolna biblioteka dla Router, Desktop i Mobile"

[features]
default = ["camera"]
docker = ["dep:bollard"]
inference-llamacpp = ["dep:tentaflow-wrappers", "tentaflow-wrappers/llama"]
inference-whisper = ["dep:tentaflow-wrappers", "tentaflow-wrappers/whisper"]
# sherpa-onnx jako embedded TTS — bindings do sherpa-onnx + onnxruntime
# z crate sherpa-rs. Niezalezny linker space (nie kolizja z ggml).
inference-sherpa = ["dep:sherpa-rs"]
# MLX inference przez Swift bridge (mlx-swift / MLXLLM). Wymagane macOS + Xcode
# — build.rs w tentaflow/ buduje libMLXBridge.dylib przez xcodebuild. Aktywne
# na desktop macOS i iOS. Stary `inference-mlx` (oparty o mlx-rs / mlx-models)
# zostal usuniety bo Rust port ma bug w 4-bit forward pass — Bielik / Qwen
# generowaly losowe tokeny.
inference-mlx = []
# MLX Whisper przez Swift bridge — laduje libMLXBridge.dylib runtime'em (dlopen)
# i wola `MLXWhisper_*` z naszego portu whisper.py do mlx-swift. Aktywne tylko
# na macOS / iOS gdzie dylib istnieje.
inference-mlx-whisper = ["dep:libloading"]
# Apple AVSpeechSynthesizer TTS jest ZAWSZE skompilowany na macOS/iOS
# (target gate w lib.rs i tts/mod.rs, plus required libloading w sekcji
# `[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]`).
# Brak feature flag — uzytkownik nie ma jak go wylaczyc i nie powinien.
# Kokoro 82M TTS przez mlx-swift port. macOS/iOS only.
inference-mlx-kokoro = ["dep:libloading"]
# Supertonic TTS przez ONNX Runtime (crate `ort`). Desktop: Linux/macOS/Windows.
# `ort` z feature `load-dynamic` dlopuje onnxruntime runtime'em (nie linkuje
# statycznie), wiec NIE koliduje z sherpa-rs (ktore tez linkuje onnxruntime
# dynamicznie) — oba moga byc wlaczone naraz bez kolizji symboli linkera.
inference-supertonic = ["dep:ort", "dep:ndarray", "dep:rand_distr", "dep:unicode-normalization", "dep:crossbeam-channel"]
# RF-DETR ADR detector (Burn). Gates the whole detector/state/OCR modules + the
# per-camera always-on analysis loop. Pulls the wgpu backend as the universal
# floor; add `vision-cuda`/`vision-metal`/`vision-rocm` for a native backend.
inference-vision-gpu = ["vision-wgpu"]
# Camera-CV via Burn. `vision-burn` pulls Burn + the vendored models; a backend
# feature picks the runtime (defaults to wgpu when none of cuda/metal/rocm set).
vision-burn = ["dep:burn", "dep:burn-store", "burn/std"]
vision-wgpu = ["vision-burn", "burn/wgpu", "burn/ndarray"]
vision-cuda = ["vision-burn", "burn/cuda"]
vision-metal = ["vision-burn", "burn/metal"]
vision-rocm = ["vision-burn", "burn/rocm"]
inference-diarization = ["dep:tentaflow-voice"]
rdma-probe = []
# Udostępnia `flow_engine::node_adapter::test_support` (stub dispatcherów +
# stub_ctx) poza testami, żeby benchmarki mogły konstruować ExecutionContext
# bez powielania no-op implów. Włączane tylko przez `[[bench]] required-features`.
test-support = []
# Desktop-only: pulls the mobile wasmi backend + exposes `runtime::runtime_wasmi`
# so `tests/addon_dotnet_e2e.rs` can prove a .NET `wasm32-wasip1` module
# instantiates under the wasmi interpreter with the production WASI shim.
wasmi-runtime-test = ["dep:wasmi"]
# Camera ingest (M1.W6) — GStreamer 1.x based pipeline for RTSP/file/V4L2/MIPI
# inputs. Optional because GStreamer pulls a large dynamic-library surface
# (gst-plugins-base, -good, -bad). Default builds stay slim; enable
# `--features camera` for Router/Desktop where camera ingest is needed.
camera = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# Jedna flaga GPU per backend wlacza lokalne LLM. Konkretny backend GPU
# wynika z natywnych bibliotek zbudowanych przez scripts/native-libs/build-all.sh.
gpu-cuda = ["inference-llamacpp"]
gpu-vulkan = ["inference-llamacpp"]
gpu-rocm = ["inference-llamacpp"]
gpu-metal = ["inference-llamacpp"]
# External Milvus backend (gRPC) selectable per addon alongside the embedded zvec.
# The embedded zvec engine itself is NOT a feature — it is a mandatory dependency
# on every platform (see below), so this only gates the optional Milvus client.
vector-milvus = ["dep:milvus-sdk-rust"]
# CozoDB embedded graph engine (services/graph). Opt-in — NOT in the default
# set. Native (server/desktop/mobile) persistent backend is `sled` (pure-Rust
# embedded KV, zero native deps and — crucially — no `links="sqlite3"` collision
# with our bundled `rusqlite`; cozo's own sqlite backend can't coexist with
# rusqlite, see services/graph/backend.rs). sled is marked *Experimental* in Cozo
# and is NOT a wasm backend — on wasm32 the engine uses `mem` only (sled pulls
# fs2/libc/mmap, which don't compile to wasm; browser persistence is deferred).
# `mem` is always available (tests + wasm). `graph-rocksdb` adds the RocksDB
# backend for large server graphs (pulls C++); its absence is NOT an error — the
# engine falls back to sled on native, `mem` on wasm. NOTE: Cozo ignores the sled
# `options` string, so sled's 1 GiB default cache per DB can't be tuned through
# Cozo; GraphManager bounds memory by capping concurrently-open handles (LRU).
# `graph` only activates the optional `cozo` dependency; the persistent backend
# (`storage-sled`) is pulled per-TARGET below, NOT by this feature — wasm32 gets
# cozo WITHOUT sled (mem-only), every other target gets sled. Forcing
# `cozo/storage-sled` here would break wasm builds (sled pulls fs2/libc/mmap)
# (runda 2 codex bug #1).
graph = ["dep:cozo"]
graph-rocksdb = ["graph", "cozo/storage-rocksdb"]

[dependencies]
# Protocol (zawsze)
tentaflow-protocol = { path = "../tentaflow-protocol" }

# UFP/2 protocol primitives (Faza 6 Krok 4c — replacing CBOR mesh + frontend
# wire formats with the unified CBOR envelope). Currently consumed by the
# mesh::ufp2 submodule for heartbeat (4c2.1); further migrations land in
# subsequent chunks.
tentaflow-sdk-spec = { path = "../tentaflow-sdk-spec" }

# Unified SLAM core: server-side shared scene map + GlobalPose from robot poses.
tentaflow-slam = { path = "../tentaflow-slam" }

# Direct CBOR codec for the mesh::ufp2 wire bytes (encode/decode of
# Envelope between iroh streams and sdk-spec types).
minicbor = { version = "2.2", default-features = false, features = ["alloc", "derive"] }


# Proc-macro #[handler] + #[policy] + #[observed]
tentaflow-macros = { path = "../tentaflow-macros" }

# Linker-based handler registration (per-handler submit, no monolithic const array)
inventory = "0.3.24"

# Async runtime
tokio = { version = "1.52.2", features = ["full"] }
async-trait = "0.1.89"
futures = "0.3.32"
async-stream = "0.3.6"
bytes = "1.12.0"
# LZ4 block codec for the lidar wire (host-side body compression). Block-only:
# no std `frame`/io needed, so it also matches the wasm decoder's feature set.
lz4_flex = { version = "0.13.1", default-features = false, features = ["safe-encode", "safe-decode"] }

# Networking — iroh (QUIC-based p2p z relay fallback, LAN mDNS, DHT discovery).
# Wspolny transport+framing udostepnia tentaflow-transport, uzywany takze przez
# tentaflow-client/native i tentaflow-containers/sidecar.
iroh = { version = "1.0.0", default-features = false, features = ["portmapper", "tls-ring"] }
iroh-relay = { version = "1.0.0", default-features = false, features = ["server"] }
iroh-mdns-address-lookup = "0.4.0"
iroh-mainline-address-lookup = "0.4.0"
tentaflow-transport = { path = "../tentaflow-transport" }
rustls = { version = "0.23.40", features = ["ring"] }
tokio-rustls = "0.26.4"
rustls-pemfile = "2.1.3"
tokio-util = { version = "0.7.18", features = ["rt"] }
pin-project-lite = "0.2"

# HTTP
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "rustls", "multipart", "blocking", "form"] }
# Klient HTTP czysto synchroniczny (bez własnego runtime tokio) dla handlerów
# treningu działających na workerze tokio — `reqwest::blocking` panikuje tam
# ("Cannot drop a runtime in a context where blocking is not allowed").
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
readability = { version = "0.3.0", default-features = false }
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1.3"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# CEL expression engine (flow variables / io-mapping / condition / loop / map —
# HARNESS_PLAN §3.12). Crate "cel" is the renamed continuation of
# "cel-interpreter" (cel-rust project; cel-interpreter stopped at 0.10).
# Default features kept minimal: no regex/chrono extension functions; "json"
# is needed for Value::json() (CEL result -> serde_json::Value).
cel = { version = "0.13.0", default-features = false, features = ["json"] }
toml = "1.1.2+spec-1.1.0"
ciborium = "0.2"

# Database
rusqlite = { version = "0.39.0", features = ["bundled"] }
fjall = "3.1.5"
# Per-addon SQLite connection pool (F1a §6.5 M1.W4). r2d2_sqlite 0.34 jest
# zgodne z rusqlite 0.39 — sprawdzone manualnie. Pool size + timeouts
# konfigurowane w addon/storage_sql.rs.
r2d2 = "0.8"
r2d2_sqlite = "0.34.0"

# Tabular dataset parsing for ML Studio data profiling (CSV + XLSX). Calamine
# reads the first worksheet without spawning a process; csv streams rows.
csv = "1.3"
calamine = "0.35.0"

# Klasyczny ML on-device — smartcore to czysty Rust (drzewa cargo: num/rand,
# zero C/Python/sys), wiec kompiluje sie tak samo na Androidzie jak na desktopie.
# default-features = [] (puste): wyłącza ndarray-bindings/serde/datasets/js, ktorych
# tabularny trener nie potrzebuje. Drzewo decyzyjne + las losowy z jawnym seedem
# (with_seed) dla deterministycznych wynikow — RNG nie zalezy od std thread_rng.
smartcore = { version = "0.5.0", default-features = false }

# Crypto
argon2 = "0.5.3"
sha2 = "0.11.0"
sha1 = "0.11.0"
hmac = "0.13.0"
aes-gcm = "0.10.3"
hkdf = "0.13.0"
zeroize = "1.9.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand_core_06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

# WebSocket
tokio-tungstenite = "0.29.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Error handling
shlex = "2.0.1"
anyhow = "1.0.102"
thiserror = "2.0.18"

# Vision inference — pure Rust ONNX runtime (tract). Zawsze wkompilowany dla
# wszystkich platform (linux/macos/windows/ios/android), bez ABI-hellu z ort.
# Uzywany do YOLOv8-face / SCRFD / MiVOLO v2 / HSEmotion / EmoNet — modele
# embedowane w binarce przez build.rs::embed_vision_models. Latencja CPU
# ~10-30 ms/twarz na M1; akceptowalnie szybko, jednolicie cross-platform.
tract-onnx = { version = "0.23.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Embedowanie kontekstu kontenerow w binarce (deploy::bundle)
flate2 = "1.1.9"
tar = "0.4.46"
tempfile = "3.27.0"

# Vector storage — embedded zvec engine (safe wrapper over the vendored C API).
# Mandatory on every platform (NOT a feature): desktop links zvec's self-contained
# shared lib, mobile links the static archive. The native artifact must be present
# for the target (scripts/build-zvec.sh / setup.sh build + vendor it).
tentaflow-zvec = { path = "../tentaflow-zvec" }
# External vector DB — official Milvus gRPC client (pure Rust). Only pulled in
# when the `vector-milvus` feature is enabled. Pinned to a git rev: the published
# 0.1.0 predates the query/flush/stats API this backend uses.
milvus-sdk-rust = { git = "https://github.com/milvus-io/milvus-sdk-rust", rev = "cce570b53d540e6a0ad7f9cf2c47c033857152ae", optional = true }

# Synchronizacja
parking_lot = "0.12.5"
dashmap = "6.2.1"
lru = "0.18.0"
blake3 = "1.8.5"
arc-swap = "1.7.1"
smallvec = "1.15.2"
rustc-hash = "2.1.2"

# Utils
uuid = { version = "1.23.3", features = ["v4", "v5", "v7"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.1"
rand_core = "0.10"
getrandom = "0.4.3"
base64 = "0.22.1"
hex = "0.4.3"
regex = "1.12.4"
semver = "1.0.28"

# Multipart form data parsing
multer = "3.1"

# Legal document rendering — Handlebars for template rendering + genpdf for
# PDF output (F2 P8.b RODO generator). genpdf bundles a PDF layout engine on
# top of printpdf so we get paragraphs / pagination without writing low-level
# text positioning code. DejaVu fonts are vendored under assets/fonts/dejavu/
# for full Polish-diacritic coverage on every platform.
handlebars = "6.4.2"
genpdf = "0.2"

# Docker (optional)
bollard = { version = "0.21.0", optional = true }

# RAG E1.4 — rasteryzacja PDF. BEZWARUNKOWE (PDF musi działać na każdym
# urządzeniu). Dynamiczne ładowanie libpdfium w runtime (bind_to_library) —
# brak feature `static` => bez bindgen/clang przy buildzie, więc kompiluje się
# na każdym targecie (w tym mobile); libpdfium dostarcza native-libs per-platforma.
# Features: `pdfium_latest` (najnowsze ABI), `image_025` (zgodne z `image` 0.25),
# `thread_safe` (mutex wokół FFI).
pdfium-render = { version = "0.9.2", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }

# Camera ingest — GStreamer 1.x Rust bindings (optional, feature `camera`).
# Version 0.23 chosen over plan's 0.21: 0.21 is from 2024 and lacks fixes
# for GStreamer 1.24+; 0.23 targets GStreamer 1.22/1.24/1.26 which matches
# our system (1.28). 0.25 also exists but landed too recently for stable
# ecosystem alignment.
gstreamer = { version = "0.25.2", optional = true }
gstreamer-app = { version = "0.25.2", optional = true }
gstreamer-video = { version = "0.25.2", optional = true }

# Inference — llama.cpp (optional)
tentaflow-wrappers = { path = "../tentaflow-wrappers", optional = true }

# Generic WebRTC channel for robot/device transport. Always compiled — webrtc is
# core transport (robot/camera), not an opt-in feature, on every platform.
tentaflow-hardware = { path = "../tentaflow-hardware" }

# STT — Whisper (optional)
# dlopen libMLXBridge.dylib — feature inference-mlx-whisper.
libloading = { version = "0.9.0", optional = true }
sherpa-rs = { version = "0.6.8", optional = true }
# Supertonic TTS — ONNX Runtime przez `ort`. `download-binaries`: ort pobiera
# i wkompilowuje WLASNY onnxruntime (~1.24, ktorego wymaga rc.12). NIE
# `load-dynamic` — bo to dlopowalo onnxruntime 1.17.1 dostarczany przez
# sherpa-rs, a `ort` rc.12 wymaga C API >= 24 (na 1.17.1 `GetApi(24)`=NULL =>
# tworzenie sesji wisi/wala sie). Wlasny onnxruntime ort wspolistnieje z
# 1.17.1 sherpy przez two-level namespace (osobne dyliby). `ndarray` daje
# Value::from_array(Array3).
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "tls-rustls", "ndarray", "std", "api-24"], optional = true }
ndarray = { version = "0.17", optional = true }
# MPMC job channel feeding each pooled ort session's dedicated OS thread (see
# vision::ort_common::SessionPool) — its Sender is Sync, so the shared pool stays
# Send+Sync while many callers submit forwards concurrently.
crossbeam-channel = { version = "0.5", optional = true }
# Burn — camera-CV inference backend (replaces ort for vision). Architectures
# are vendored under src/vision/generated/ (build-time ONNX→Burn codegen); the
# backend is picked per platform via the `vision-*` features. Weights = runtime .bpk.
# default-features = false drops burn-dataset (pulls rusqlite/libsqlite3-sys that
# conflicts with our rusqlite). We only need std + nn + a backend (added per vision-*).
burn = { version = "0.21", default-features = false, optional = true }
# Only the burnpack (.bpk) loader; default features pull `pytorch`→`zip`/`tar`
# which conflict with the rest of the tree (iroh's data-encoding lock).
burn-store = { version = "0.21", default-features = false, features = ["std", "burnpack"], optional = true }
rand_distr = { version = "0.6.0", optional = true }
unicode-normalization = { version = "0.1", optional = true }
symphonia = { version = "0.6.0", default-features = false, features = ["mp3", "ogg", "vorbis", "pcm", "wav"] }

# Speaker diarization — pure Rust forward pass przez tentaflow-voice
# Cross-platform (Linux/macOS/Windows/iOS/Android), bez ort/onnxruntime ABI hell
tentaflow-voice = { path = "../tentaflow-voice", optional = true }

# Embedded static files — generowane przez build.rs (bez include_dir!)
# MIME detection jest w build.rs

# Mesh
hostname = "0.4.2"
sysinfo = "0.39.5"
num_cpus = "1"
which = "8.0.4"
# python-build-standalone dystrybuuje archiwa .tar.zst (domyslnie) — zstd dekoder
zstd = "0.13.3"
zip = "8.6.0"
# Parser XML dla ekstrakcji DOCX (word/document.xml) i PPTX (ppt/slides/slideN.xml)
# w node-adapterach flow-ingestu RAG. default-features=false wyłącza `encoding`,
# co odsłania `unescape_value`/`config_mut` (API używane przez ekstraktor; zgodne
# z wersją w addonie RAG).
quick-xml = { version = "0.36", default-features = false }
rcgen = "0.14.8"

# Pobieranie modeli z HuggingFace. `tokio` = async API (model_manager, stt);
# `ureq` = sync API (`api::sync`) wymagane przez loader Apple MLX Kokoro
# (tts/mlx_kokoro.rs). Oba klienty współdzielą backend rustls.
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "ureq", "rustls-tls"] }

# Hub — wyszukiwanie i magazyn modeli
urlencoding = "2"
url = "2"
dirs = "6.0.0"
subtle = "2"

# Enumeracja interfejsow sieciowych (IPv4-only advertise/bind dla iroh mesh)
netdev = "0.45.0"

# WASM runtime — wasmtime na Desktop/Router, wasmi na Mobile (iOS/Android)
# Target-specific dependencies ponizej

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# Parser plist do wynikow `powermetrics -f plist` (samplery cpu_power / gpu_power)
plist = "1.9.0"

# libloading jest required na macOS/iOS, bo apple-tts (AVSpeechSynthesizer
# przez libMLXBridge.dylib) jest ZAWSZE skompilowany na tych targetach,
# bez feature flag. Inne featury (mlx-whisper, mlx-kokoro) tez go uzywaja
# pod feature flag — ten wpis zapewnia ze libloading jest dostepny niezaleznie.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libloading = "0.9.0"


[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
wasmtime = "46.0.0"
wasmtime-wasi = "46.0.0"
wgpu = "29.0.3"
# Off by default. Enabled only by the `wasmi-runtime-test` feature so a Desktop
# test can instantiate a .NET `wasm32-wasip1` module through the real mobile
# wasmi backend (regression guard for the WASI preview1 shim). Normal Desktop
# builds never pull wasmi.
wasmi = { version = "1.1.0", optional = true }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
wasmi = "1.1.0"

# Embedded graph database (services/graph) — only pulled in by the `graph`
# feature (`optional = true` + `dep:cozo`). The persistent `sled` backend is
# gated PER-TARGET (runda 2 codex bug #1): every non-wasm target gets
# `storage-sled` (pure-Rust embedded KV, no `links="sqlite3"` collision with our
# bundled rusqlite); wasm32 gets cozo WITHOUT sled (mem-only — sled pulls
# fs2/libc/mmap which don't compile to wasm). RocksDB stays an additive opt-in via
# the `graph-rocksdb` feature (server only, non-wasm).
#
# `graph-algo` (wbudowany PageRank Cozo) jest CELOWO wyłączone: rozwija się do
# `["graph", "rayon"]`, gdzie feature `graph` ciągnie crate `graph_builder`, który
# unifikuje rayon do wersji niezgodnej z resztą binarki (E0271/E0308 przy pełnym
# buildzie). Włączamy więc TYLKO `rayon` (cozo używa go wewnętrznie w eval/lib i
# bez niego sam się nie kompiluje), bez `graph`/`graph_builder`. PageRank liczymy
# w Rust nad CSR (`services/graph/ppr.rs` z pustymi seedami = globalny PageRank).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cozo = { version = "0.7.6", default-features = false, features = ["storage-sled", "rayon"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cozo = { version = "0.7.6", default-features = false, features = ["rayon"], optional = true }

[build-dependencies]
rcgen = "0.14.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2+spec-1.1.0"
sha2 = "0.11.0"
hex = "0.4"
walkdir = "2"

[dev-dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
wasmtime = "46.0.0"
tempfile = "3"
criterion = { version = "0.8.2", features = ["html_reports"] }
wiremock = "0.6"
dhat = "0.3"
filetime = "0.2.29"

[[bench]]
name = "noop"
harness = false

[[bench]]
name = "audio_pipeline_clones"
harness = false

[[bench]]
name = "streaming_pickup_perf"
harness = false

[[bench]]
name = "recording_perf"
harness = false
required-features = ["camera"]

[[bench]]
name = "sql_host_perf"
harness = false

[[bench]]
name = "migration_perf"
harness = false

[[bench]]
name = "service_call_perf"
harness = false

[[bench]]
name = "manifest_perf"
harness = false

[[bench]]
name = "flow_executor_perf"
harness = false
required-features = ["test-support"]

[[bench]]
name = "resize_perf"
harness = false

[[bench]]
