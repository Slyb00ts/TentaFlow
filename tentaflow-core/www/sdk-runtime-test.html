-->
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>TentaFlow SDK runtime — testy</title>

    pre[data-status="fail"] { color: #f08080; }

<body>
  <h1>TentaFlow SDK runtime — testy</h1>
  <pre id="out">Ładuję testy…</pre>
  <script type="module">
    import { reportResults } from '/js/sdk-runtime/state-store.test.js';
    reportResults(document.getElementById('out'));

</body>
</html>
