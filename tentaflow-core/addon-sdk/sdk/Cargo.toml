[package]
name = "tentaflow-addon-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK dla addonow TentaFlow — helpery, bindingi do host functions, typy"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
# Typed UI schema (shared with the host crate). Re-exported as `ui::*` so
# addons build `PanelTree` values directly instead of `serde_json::json!{}`
# (eliminates the intermediate `Value` round-trip).
tentaflow-ui-schema = { workspace = true }
# Base64 dla BLOB (SqlValue::Bytes) w SQL API. Wersja zgodna z core.
base64 = { workspace = true }
ciborium = { workspace = true }
# Wspoldzielone struktury ABI (CBOR source of truth) — te same typy co host.
tentaflow-sdk-spec = { workspace = true }
# minicbor — encode/decode wspoldzielonych struktur camera ABI.
minicbor = { workspace = true, features = ["alloc", "derive"] }
