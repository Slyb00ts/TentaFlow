[package]
name = "tentaflow-addon-template"
version = "0.1.0"
edition = "2021"
description = "Przykladowy addon dla TentaFlow — szablon do tworzenia wlasnych addonow"

[lib]
crate-type = ["cdylib"]

[dependencies]
tentaflow-addon-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
