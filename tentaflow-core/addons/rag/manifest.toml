[[tool.parameter]]
name = "limit"
param_type = "integer"
description = "Rozmiar strony (cap 200, domyslnie 50)."
required = false

[[tool.parameter]]
name = "offset"
param_type = "integer"
description = "Przesuniecie strony."
required = false

[[tool]]
id = "conflict_detail"
display_name = "Szczegoly konfliktu"
description = "Szczegoly konfliktu po dedup_key: grupa, czlonkowie (fakty), dowody zrodlowe i decyzja A_res."
keywords = ["rag", "conflict", "detail", "evidence"]

[[tool.parameter]]
name = "dedup_key"
param_type = "string"
description = "Klucz grupy konfliktowej."
required = true

[[tool]]
id = "resolve_escalated"
display_name = "Rozstrzygnij eskalowany konflikt"
description = "Reczne rozstrzygniecie konfliktu 'escalated': keep_winner (tombstone przegranych odwracalnie) albo dismiss."
keywords = ["rag", "conflict", "resolve", "escalated", "admin"]

[[tool.parameter]]
name = "conflict_id"
param_type = "integer"
description = "Identyfikator konfliktu."
required = true

[[tool.parameter]]
name = "action"
param_type = "string"
description = "keep_winner albo dismiss."
required = true

[[tool.parameter]]
name = "winner_fact_key"
param_type = "string"
description = "Klucz zwycieskiego faktu (wymagany dla keep_winner)."
required = false

[[tool]]
id = "graph_explore"
display_name = "Eksplorator grafu"
description = "Sasiedztwo encji w 'kg_active' (po node_id albo nazwie) z faktami i provenance. Cap wezlow/krawedzi."
keywords = ["rag", "graph", "explore", "graf", "encja"]

[[tool.parameter]]
name = "entity_query"
param_type = "string"
description = "Nazwa encji do dopasowania (alternatywa dla node_id)."
required = false

[[tool.parameter]]
name = "node_id"
param_type = "string"
description = "Znormalizowane id wezla (alternatywa dla entity_query)."
required = false

[[tool.parameter]]
name = "limit"
param_type = "integer"
description = "Cap liczby sasiadow/faktow (max 60)."
required = false

# A_uni (MemGraphRAG D5): Structural Unification — skan kandydatow merge encji + scalanie.
# Wolalny przez Scheduler (interval) ORAZ recznie. Konsumuje tez konflikty
# 'resolved_merge_pending' z A_res (D4).
[[tool]]
id = "entity_merge_scan"
display_name = "Skan scalania encji"
description = "A_uni (0 LLM w detekcji): wykrywa kandydatow merge encji (type-based: ten sam typ + podobna nazwa; similarity-based: embedding nazwy, k-NN). Powyzej progu twardego auto-scala aliasy w kanoniczny wezel (odwracalnie, przez outbox), w szarej strefie tworzy konflikt 'entity_merge' (open) dla A_res. Konsumuje tez 'resolved_merge_pending' z A_res."
keywords = ["rag", "entity", "merge", "unification", "alias", "dedup"]

[[tool.parameter]]
name = "collection_id"
param_type = "string"
description = "Identyfikator kolekcji (sentinel: skan jest per-instancja)."
required = false

[[tool.parameter]]
name = "batch_size"
param_type = "integer"
description = "Rozmiar partii skanu nowych encji."
required = false

# Odwracalnosc (R5): cofniecie zastosowanego merge'u z entity_merge_log (inverse-outbox).
[[tool]]
id = "entity_merge_undo"
display_name = "Cofnij scalanie encji"
description = "Cofa zastosowany merge encji (R5): z entity_merge_log odtwarza inverse-outbox (przywraca krawedzie aliasu, kasuje dodane kanoniczne gdy nie sa wspoldzielone), oznacza alias 'reverted'. Pelna sciezka odwrocenia."
keywords = ["rag", "entity", "merge", "undo", "revert", "alias"]

[[tool.parameter]]
name = "alias_id"
param_type = "string"
description = "Znormalizowane id aliasu do cofniecia merge'u."
required = true
