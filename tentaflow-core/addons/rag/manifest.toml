# --- Read-side tooly GUI (kolekcje/dokumenty/konflikty/graf) ---
# Czyste odczyty (poza delete/resolve, ktore mutuja ODWRACALNIE). Parametryzowany SQL,
# capy, paginacja, izolacja per-instancja. Konsumowane przez panel main i wolalne recznie.

[[tool]]
id = "delete_collection"
display_name = "Usun kolekcje"
description = "Usuwa kolekcje kaskadowo (dokumenty, chunki, wektory, graf przez odwracalny cleanup outboxu)."
keywords = ["rag", "collection", "delete", "usun"]

[[tool.parameter]]
name = "collection_id"
param_type = "string"
description = "Identyfikator kolekcji do usuniecia."
required = true

[[tool]]
id = "delete_document"
display_name = "Usun dokument"
description = "Usuwa pojedynczy dokument: chunki, wektory 'passages' i jego wklad do grafu."
keywords = ["rag", "document", "delete", "usun"]

[[tool.parameter]]
name = "document_id"
param_type = "string"
description = "Identyfikator dokumentu do usuniecia."
required = true

[[tool]]
id = "collection_ingest_status"
display_name = "Status ingestu kolekcji"
description = "Zagregowany status ingestu kolekcji: liczniki dokumentow per status + ile ma graph_partial."
keywords = ["rag", "ingest", "status", "collection"]

[[tool.parameter]]
name = "collection_id"
param_type = "string"
description = "Identyfikator kolekcji."
required = true

[[tool]]
id = "list_conflicts"
display_name = "Lista konfliktow"
description = "Listuje konflikty MemGraphRAG z opcjonalnym filtrem statusu i paginacja."
keywords = ["rag", "conflict", "list", "konflikt"]

[[tool.parameter]]
name = "status"
