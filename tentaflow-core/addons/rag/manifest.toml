[addon]
id = "rag"
name = "RAG"
version = "0.1.5"
description = "Niezalezne instancje RAG — kolekcje, ingest dokumentow (parse + chunk + embedding), wyszukiwanie wektorowe i graf wiedzy."
category = "AI"
keywords = ["rag", "retrieval", "embeddings", "vector", "graph", "ingest", "dokumenty"]
author = "TentaFlow"
license = "Apache-2.0"
homepage = ""
icon = "rag-db"
runtime = "wasmtime"
platforms = ["linux", "macos", "windows", "ios", "android"]
wasm_file = "addon.wasm"

# --- Uprawnienia ---
# Uwaga: czesc uprawnien (vector.read, graph.read/write, document.write, flow.invoke)
# jeszcze nie jest uzywana przez ingest — zadeklarowane swiadomie dla query/graph
# slice (Etap 1/2), nie sa przypadkowe.

[[permission]]
id = "sql.read"
display_name = "Odczyt metadanych RAG"
description = "Czyta kolekcje, dokumenty, chunki i joby ingestu z bazy instancji RAG."
risk = "low"

[[permission]]
id = "sql.write"
display_name = "Zapis metadanych RAG"
description = "Tworzy i aktualizuje kolekcje, dokumenty, chunki i joby ingestu."
risk = "medium"

[[permission]]
id = "vector.read"
display_name = "Wyszukiwanie wektorowe"
description = "k-NN nad przestrzenia wektorowa 'passages' instancji RAG."
risk = "low"

[[permission]]
id = "vector.write"
display_name = "Zapis wektorow"
description = "Upsert/delete wektorow chunkow w przestrzeni 'passages'."
risk = "medium"

[[permission]]
id = "graph.read"
display_name = "Odczyt grafu wiedzy"
description = "Odczyt encji i relacji z kolekcji grafowej 'kg_active' (aktywny widok MemGraphRAG)."
risk = "low"

[[permission]]
id = "graph.write"
display_name = "Zapis grafu wiedzy"
description = "Zapis encji i relacji do kolekcji grafowej 'kg_active' (aktywny widok MemGraphRAG)."
risk = "medium"

[[permission]]
id = "document.read"
display_name = "Odczyt plikow zrodlowych"
description = "Czyta surowe pliki (PDF/obraz) z per-instance document store."
risk = "low"

[[permission]]
id = "document.write"
display_name = "Zapis plikow zrodlowych"
description = "Zapisuje wgrane pliki zrodlowe do per-instance document store."
risk = "medium"

[[permission]]
id = "document.parse"
display_name = "Parsowanie dokumentow"
description = "Parsuje obrazy stron dokumentow na markdown przez alias rag-parse."
risk = "medium"

[[permission]]
id = "llm.generate"
display_name = "Generowanie embeddingow / LLM"
description = "Wola modele embeddingow (rag-embeddings) i LLM (rag-llm) przez host."
risk = "medium"

[[permission]]
id = "flow.invoke"
display_name = "Uruchamianie flow zapytan"
description = "Wyzwala flow zapytania RAG (retrieval -> rerank -> llm) — Etap 1."
risk = "medium"

[[permission]]
id = "ui"
display_name = "Interfejs RAG"
description = "Renderuje panel RAG (kolekcje, status ingestu) w launcherze."
risk = "low"

[[permission]]
id = "state.read"
display_name = "Odczyt stanu instancji"
description = "Czyta instancyjny stan KV (m.in. nazwe published query-flow z install)."
risk = "low"

[[permission]]
id = "state.write"
display_name = "Zapis stanu instancji"
description = "Zapis instancyjnego stanu KV (rezerwa pod cache zapytan RAG)."
risk = "low"

# --- Aliasy modeli wystawiane przez addon (z suggested_default) ---

[[alias]]
id = "rag-embeddings"
display_name = "RAG — embeddingi"
methods = ["embed"]
suggested_default = "llama-nemotron-embed-vl-1b-v2"
visibility = "private"

[[alias]]
id = "rag-llm"
display_name = "RAG — LLM"
methods = ["chat"]
suggested_default = "nemotron-3-super-120b"
visibility = "private"

[[alias]]
id = "rag-reranker"
display_name = "RAG — reranker"
methods = ["rerank"]
suggested_default = "llama-nemotron-rerank-vl-1b-v2"
visibility = "private"

[[alias]]
id = "rag-parse"
display_name = "RAG — parsowanie dokumentow"
methods = ["parse"]
suggested_default = "nemotron-parse-v1-2"
visibility = "private"

# Detektory struktury strony (PARTIA 0 typed-surface Documents) — pod przyszle
# nody page_detect_pages / table_structure / ocr_pages w flow-ingescie. Wzor rag-parse.
[[alias]]
id = "rag-page-elements"
display_name = "RAG — elementy strony"
methods = ["documents"]
suggested_default = "nemotron-page-elements"
visibility = "private"

[[alias]]
id = "rag-table-structure"
display_name = "RAG — struktura tabel"
methods = ["documents"]
suggested_default = "nemotron-table-structure"
visibility = "private"

[[alias]]
id = "rag-graphic-elements"
display_name = "RAG — elementy graficzne"
methods = ["documents"]
suggested_default = "nemotron-graphic-elements"
visibility = "private"

[[alias]]
id = "rag-ocr"
display_name = "RAG — OCR"
methods = ["documents"]
suggested_default = "nemotron-ocr"
visibility = "private"

# --- Aliasy konsumowane przez addon ---
# rag-llm i rag-reranker sa dla query slice (Etap 1) — swiadomie required=false.

[[uses_alias]]
id = "rag-embeddings"
required = true
reason = "Generowanie wektorow chunkow podczas ingestu."

[[uses_alias]]
id = "rag-llm"
required = false
reason = "Generowanie odpowiedzi w flow zapytania (Etap 1)."

[[uses_alias]]
id = "rag-reranker"
required = false
reason = "Re-ranking kandydatow w retrievalu (Etap 1)."

[[uses_alias]]
id = "rag-parse"
required = true
reason = "Parsowanie obrazow stron PDF/skanow na markdown (ingest image/PDF go wymaga)."

# Detektory struktury — required=false (pod przyszle nody flow-ingestu page/table/ocr).
[[uses_alias]]
id = "rag-page-elements"
required = false
reason = "Detekcja elementow strony w flow-ingescie (page_detect_pages)."

[[uses_alias]]
id = "rag-table-structure"
required = false
reason = "Detekcja struktury tabel w flow-ingescie (table_structure)."

[[uses_alias]]
id = "rag-graphic-elements"
required = false
reason = "Detekcja elementow graficznych w flow-ingescie."

[[uses_alias]]
id = "rag-ocr"
required = false
reason = "OCR stron w flow-ingescie (ocr_pages)."

# --- Przestrzen wektorowa chunkow ---

[[vector_namespace]]
name = "passages"
dimensions = 2048
distance = "cosine"
data_class = "C"

[[vector_namespace.fields]]
name = "doc_id"
type = "str"
indexed = true

[[vector_namespace.fields]]
name = "chunk_index"
type = "int"
indexed = true

[[vector_namespace.fields]]
name = "created_at"
type = "int"
indexed = false

# collection_id — indeksowane, by query-flow mogl filtrowac retrieval po kolekcji.
[[vector_namespace.fields]]
name = "collection_id"
type = "str"
indexed = true

# text — tresc chunka przechowywana przy wektorze, by query-flow (vector search)
# mogl zwrocic ja przez output_fields i zbudowac kontekst dla LLM bez siegania do
# instancyjnego SQLite z poziomu wezla flow. Nieindeksowane (nie filtrujemy po tresci).
[[vector_namespace.fields]]
name = "text"
type = "str"
indexed = false

# --- Przestrzen wektorowa NAZW ENCJI (MemGraphRAG D5, Structural Unification) ---
# Embedding nazwy encji (wezla grafu) pod similarity-based kandydatow entity merge.
# entity_merge_scan embeduje nazwy nowych encji do tej przestrzeni (leniwie) i robi
# k-NN, by znalezc encje o podobnych nazwach poza progiem prefix/edit-distance (np.
# "USA" vs "United States"). ref_id = stabilny hash node_id (deterministyczny, by
# re-embedding tej samej encji nadpisywal jej wektor, nie duplikowal).
[[vector_namespace]]
name = "entities"
dimensions = 2048
distance = "cosine"
data_class = "C"

# node_id — znormalizowane id encji (klucz wezla grafu). Indeksowane: hit k-NN zwraca
# je przez output_fields, by skan wiedzial KTORA encja jest kandydatem (ref_id to tylko
# hash, nie da sie z niego odzyskac node_id).
[[vector_namespace.fields]]
name = "node_id"
type = "str"
indexed = true

# label — typ encji (Person/City/...). Indeksowany: similarity-merge laczymy tylko
# encje TEGO SAMEGO typu (jak type-based), wiec filtrujemy k-NN po label.
[[vector_namespace.fields]]
name = "label"
type = "str"
indexed = true

# --- Flow zapytania (flow_engine) ---
# Rejestrowany przy install instancji jako published model "{addon_id}:query".
# Addon wyzwala go przez llm_generate(model=<ta nazwa>); executor przepisuje
# tozsamosc instancji do ExecutionContext, wiec wezel vector uderza w przestrzen
# 'passages' TEJ instancji.

# query MUSI byc pierwszy: register_engine_flows zapisuje nazwe PIERWSZEGO
# engine-flow do KV instancji (engine_flow_model), ktora odczytuje narzedzie ask.
[[engine_flow]]
id = "query"
path = "flows/query.flow.json"
service_type = "chat"
description = "Multi-hop RAG: petla retrieval-round (sedzia LLM) -> finalna odpowiedz z cytatami."

# retrieval_round — cialo pojedynczego hopu, wykonywane przez loop block z query.
# Rejestrowane jako osobny engine-flow, bo loop.body_flow_engine_id rozwiazuje je
# po install-stabilnej published-name {addon_id}:retrieval_round (id wiersza flow
# to losowy UUID nadawany przy install). NIE jest wolane bezposrednio jako model.
[[engine_flow]]
id = "retrieval-round"
path = "flows/retrieval_round.flow.json"
service_type = "chat"
description = "Cialo jednego hopu petli multi-hop: embed -> vector -> rerank -> akumulacja -> sedzia."

# ingest — flow-ingest JEDNEGO dokumentu. Published-name `{addon_id}:ingest`,
# wiazanie flow_model_bindings matchuje DOKLADNIE te nazwe. Addon czyta ja z KV
# (`engine_flow_model:ingest`) i podaje jako `model` do `ingest_invoke`, ktory
# dispatchuje po (model, service_type="ingest", modality="document"). service_type
# musi byc "ingest" — execute_ingest resolwuje dokladnie pod tym typem.
[[engine_flow]]
id = "ingest"
path = "flows/ingest.flow.json"
service_type = "ingest"
description = "Flow-ingest dokumentu: router -> parse/extract -> combine -> chunk -> embed -> store."

# --- Kolekcja grafowa: aktywny widok MemGraphRAG, materializowany z outboxu ---
# 'kg_active' zawiera TYLKO aktywne fakty (w D1 = wszystkie); pelny ledger faktow
# zyje w SQLite (zrodlo prawdy, R1/R2), graf jest odtwarzalna materializacja.

[[graph_collection]]
name = "kg_active"
data_class = "C"

[visibility]
admin_only = false
default_groups = []
show_in_catalog = true

[application]
entry_panel = "main"
title = "RAG"
icon = "rag-db"
description = "Kolekcje, ingest dokumentow i wyszukiwanie semantyczne."
sort_order = 30

[storage]
sql = true
sql_backends = ["sqlite"]
sql_dialect = "sqlite"
migrations_dir = "migrations"
encryption = "none"

[resources]
memory_mb = 256
fuel_limit = 200000000
storage_total_mb = 1024
llm_tokens_per_min = 500000

[lifecycle]
background = false
auto_start = false

