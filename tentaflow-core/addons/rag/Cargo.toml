# =============================================================================
# Plik: addons/rag/Cargo.toml
# Opis: Crate addona RAG (WASM cdylib) — fundament ingestu: parse -> chunk ->
#       embedding (alias rag-embeddings) -> vector upsert + zapis chunkow do SQL.
# =============================================================================
[package]
name = "tentaflow-addon-rag"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tentaflow-addon-sdk = { path = "../../addon-sdk/sdk" }
tentaflow-sdk-spec = { path = "../../../tentaflow-sdk-spec" }
minicbor = { version = "2.2", default-features = false, features = ["alloc"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Office: czysto-rustowe parsery dla wasm32-wasip1 (bez natywnych zaleznosci C,
# bez FS — czytamy z bajtow w pamieci).
calamine = { version = "0.26", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = { version = "0.36", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
