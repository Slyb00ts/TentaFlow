# =============================================================================
# Plik: addons/rag/Cargo.toml
# Opis: Crate addona RAG (WASM cdylib) — fundament ingestu: parse -> chunk ->
#       embedding (alias rag-embeddings) -> vector upsert + zapis chunkow do SQL.
# =============================================================================
[package]
name = "tentaflow-addon-rag"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tentaflow-addon-sdk = { workspace = true }
tentaflow-sdk-spec = { workspace = true }
minicbor = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, default-features = true }
serde = { workspace = true, features = ["derive"] }
