[package]
name = "tentaflow-addon-mcp-core"
version = "1.0.0"
edition = "2021"

# Shared MCP client logic for the `mcp` and `ibm-mcp` addons. This crate has
# no manifest.toml on purpose — build.rs skips it, it is linked as an rlib.
[lib]
crate-type = ["rlib"]

[dependencies]
tentaflow-addon-sdk = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
