[addon]
id = "ml-studio"
name = "ML Studio"
version = "0.1.0"
description = "Project-centric ML workspace: datasets, schemas, training runs, model registry and shared lookup resources."
category = "ml"
keywords = ["ml", "studio", "training", "datasets", "models", "rag"]
author = "TentaFlow"
license = "Apache-2.0"
homepage = "https://tentaflow.local/addons/ml-studio"
icon = "cpu"
runtime = "wasmtime"
platforms = ["linux", "macos", "windows", "ios", "android"]
wasm_file = "addon.wasm"

[[permission]]
id = "sql.read"
display_name = "Read ML projects"
description = "Reads projects, datasets, schemas, training runs and models from the ML Studio database."
risk = "medium"

[[permission]]
id = "sql.write"
display_name = "Write ML projects"
description = "Creates and updates projects, datasets, schemas, training runs and models in the ML Studio database."
risk = "medium"

[[permission]]
id = "ui"
display_name = "ML Studio interface"
description = "Renders ML Studio application views in the TentaFlow launcher."
risk = "low"

[visibility]
admin_only = false
default_groups = []
show_in_catalog = true

[application]
entry_panel = "main"
title = "ML Studio"
icon = "cpu"
description = "Projects, datasets, training runs and model registry for ML workflows."
sort_order = 30

[storage]
sql = true
sql_backends = ["sqlite"]
sql_dialect = "sqlite"
migrations_dir = "migrations"
encryption = "none"

[resources]
memory_mb = 128
fuel_limit = 50000000
storage_total_mb = 512

[lifecycle]
background = false
auto_start = false

[[tool]]
id = "list_projects"
display_name = "List ML projects"
description = "Lists ML Studio projects, optionally filtered by project type."
keywords = ["ml", "projects", "list"]

[[tool.parameter]]
name = "project_type"
param_type = "string"
description = "Optional project type filter."
required = false

[[tool]]
id = "create_project"
display_name = "Create ML project"
description = "Creates a new ML Studio project with a name, optional description and a project type."
keywords = ["ml", "project", "create"]

[[tool.parameter]]
name = "name"
param_type = "string"
description = "Project name."
required = true

[[tool.parameter]]
name = "description"
param_type = "string"
description = "Optional project description."
required = false

[[tool.parameter]]
name = "project_type"
param_type = "string"
description = "Project type key (image-recognition, ft-llm, ft-vision-audio, tabular-anomaly, rag, distillation)."
required = true

[[tool]]
id = "open_project"
display_name = "Open ML project"
description = "Returns the full record of a single ML Studio project."
keywords = ["ml", "project", "open"]

[[tool.parameter]]
name = "project_id"
param_type = "string"
description = "Project identifier."
required = true

[[tool]]
id = "list_project_types"
display_name = "List project types"
description = "Returns the catalog of supported ML Studio project types."
keywords = ["ml", "project", "types"]
