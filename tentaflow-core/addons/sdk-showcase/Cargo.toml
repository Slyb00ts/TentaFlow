[package]
name = "tentaflow-addon-sdk-showcase"
version = "1.0.0"
edition = "2021"
description = "Consolidated test/showcase addon — exercises host functions (storage, sql, camera, vector, events, llm) and renders the full SDK component catalog over the binary CBOR UI protocol."

[lib]
crate-type = ["cdylib"]

[dependencies]
tentaflow-addon-sdk = { workspace = true }
tentaflow-sdk-spec = { workspace = true }
minicbor = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, default-features = true }
