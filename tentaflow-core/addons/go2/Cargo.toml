[package]
name = "tentaflow-addon-go2"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tentaflow-sdk-spec = { path = "../../../tentaflow-sdk-spec" }
# Shared Go2 signaling crypto/framing (wasm32-compatible; no webrtc/tokio).
tentaflow-hardware = { path = "../../../tentaflow-hardware", default-features = false, features = ["protocol"] }
minicbor = { version = "2.2", default-features = false, features = ["alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
