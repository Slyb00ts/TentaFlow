[package]
name = "tentaflow-addon-go2"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tentaflow-sdk-spec = { workspace = true }
# Shared Go2 signaling crypto/framing (wasm32-compatible; no webrtc/tokio).
tentaflow-hardware = { workspace = true, features = ["protocol"] }
minicbor = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["alloc"] }
base64 = { workspace = true }
# LZ4 block decompression for the Go2 voxel map (no_std + alloc, no SIMD/std).
# Matches the upstream go2_webrtc_connect native decoder (`lz4.block.decompress`).
lz4_flex = { workspace = true, features = ["safe-decode"] }

# Tests build a synthetic compressed voxel frame, so the encode side is needed
# only for `cargo test` — never in the wasm artifact (decode-only at runtime).
[dev-dependencies]
lz4_flex = { workspace = true, features = ["safe-decode", "safe-encode"] }
