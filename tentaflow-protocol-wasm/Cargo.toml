[package]
name = "tentaflow-protocol-wasm"
version = "0.1.0"
edition = "2021"
authors = ["TentaFlow"]
description = "WASM bindings dla tentaflow-protocol — browser-side CBOR codec + Envelope helpers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core protocol types
tentaflow-protocol = { workspace = true }

# WASM bindings. Trio (wasm-bindgen / js-sys / web-sys) is version-locked and MUST
# match the wasm-bindgen-cli that build.rs runs — keep `setup.sh` WASM_BINDGEN_VERSION
# in lockstep, else glue generation fails ("schema version mismatch" in the dashboard).
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Storage", "Window", "WebTransport", "WebTransportBidirectionalStream", "WebTransportReceiveStream", "WebTransportSendStream", "WritableStream", "WritableStreamDefaultWriter", "ReadableStream", "ReadableStreamDefaultReader"] }

# SDK spec types for UI channel CBOR encode/decode
tentaflow-sdk-spec = { workspace = true }
minicbor = { workspace = true, features = ["alloc"] }
# LZ4 block decode for the lidar wire body (matches the host's encoder features).
lz4_flex = { workspace = true, features = ["safe-decode"] }

# serde_json — for browser-side payload construction
serde_json = { workspace = true, default-features = true }

# Ed25519 identity (node keypair) — generowany w browser i persistowany w localStorage
ed25519-dalek = { workspace = true }
# Losowość w przeglądarce pochodzi z Crypto.getRandomValues.
getrandom = { workspace = true, features = ["wasm_js"] }
hex = { workspace = true, features = ["alloc"] }

# Logging w browser
console_error_panic_hook = { workspace = true, optional = true }

[features]
default = ["console_error_panic_hook"]
