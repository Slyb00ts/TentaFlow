# ===== File: Cargo.toml — FORGE workspace manifest =====
[workspace]
resolver = "2"
members = ["crates/forge-types", "crates/forge-hal", "crates/forge-kernels", "crates/forge-formats", "crates/forge-tokenize", "crates/forge-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
forge-types = { path = "crates/forge-types" }
forge-hal = { path = "crates/forge-hal" }
forge-kernels = { path = "crates/forge-kernels" }
forge-formats = { path = "crates/forge-formats" }
forge-tokenize = { path = "crates/forge-tokenize" }
cudarc = { version = "0.19.8", default-features = false, features = [
    "std",
    "driver",
    "dynamic-loading",
    "cuda-13030",
] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2.21", features = ["json", "loop_controls", "fuel"] }
minijinja-contrib = { version = "2.21", features = ["pycompat"] }
chrono = "0.4"
memmap2 = "0.9"
ron = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
