# ===== File: Cargo.toml — forge-whisper: Whisper STT engine (encoder-decoder over FORGE kernels) =====
[package]
name = "forge-whisper"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Backend AMD. Bez tego testy tego crate buduja sie z samym CUDA i na
# maszynie z Radeonem nie widza zadnego urzadzenia.
hip = ["forge-hal/hip", "forge-kernels/hip"]

[dependencies]
forge-types.workspace = true
forge-hal.workspace = true
forge-kernels.workspace = true
forge-formats.workspace = true
forge-tokenize.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
serde_json = { workspace = true, default-features = true }
half = { workspace = true, features = ["bytemuck"] }
bytemuck = { workspace = true, features = ["derive"] }
rustfft.workspace = true
hound.workspace = true
