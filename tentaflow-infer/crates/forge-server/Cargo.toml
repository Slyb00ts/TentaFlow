# ===== File: Cargo.toml — forge-server: OpenAI-compatible HTTP frontend =====
[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Backend AMD. Bez tego testy tego crate buduja sie z samym CUDA i na
# maszynie z Radeonem nie widza zadnego urzadzenia.
hip = ["forge-hal/hip", "forge-engine/hip"]

[dependencies]
forge-types.workspace = true
forge-hal.workspace = true
forge-formats.workspace = true
forge-tokenize.workspace = true
forge-grammar.workspace = true
forge-engine.workspace = true
forge-whisper.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["multipart"] }
tokio.workspace = true
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
futures.workspace = true
sha2 = "0.10"
bytemuck.workspace = true
