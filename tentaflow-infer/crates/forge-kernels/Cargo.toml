# ===== File: Cargo.toml — forge-kernels: Mojo PTX artifact registry + typed launchers =====
[package]
name = "forge-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Backend AMD dla testów kerneli (kompilowane razem z CUDA, wybór w forge-hal::gpu).
hip = ["forge-hal/hip"]
# Kernele Metal (macOS). Zrodla MSL kompilowane przez backend przy ladowaniu.
metal = ["forge-hal/metal"]
# Typuje ścieżkę Metalową na KAŻDEJ platformie, bez backendu HAL-a i bez
# linkowania. Istnieje, bo zmiana wspólnego kontraktu (`Op`, `Executor`) psuła
# `MetalExec` po cichu: jedyna maszyna, która to widziała, była tą jedną z
# Makiem. `cargo check -p forge-kernels --features metal-check` odbija to od
# kompilatora wszędzie.
metal-check = []
# Ramię ANE (CoreML) w podziale wierszy prefillu. Wymaga Metala (bufory
# wspólne, kernel scatter) i wiązania CoreML z forge-hal.
ane = ["metal", "forge-hal/coreml", "dep:tracing"]
# Typuje ramię ANE na KAŻDEJ platformie, bez wiązania CoreML: zaślepka
# `CoreMlModel` w `ane_matmul` odmawia w czasie wykonania, ale kontrakt
# z `MetalExec` (Job, sloty, role) sprawdza kompilator. build.rs zamienia
# `ane` lub `ane-check` na wspólny `cfg(forge_ane)`.
ane-check = ["metal-check", "dep:tracing"]

[dependencies]
forge-types.workspace = true
forge-hal.workspace = true
forge-formats.workspace = true
forge-graph.workspace = true
forge-state.workspace = true
half = { workspace = true, features = ["bytemuck"] }
bytemuck = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[build-dependencies]
serde_json = { workspace = true, default-features = true }

[dev-dependencies]
# Wyłącznie dla `examples/prefill_bench.rs`: mierzone są kernele tego crate'u, a
# `forge-model` dostarcza opis modelu, który je uruchamia. Zależność dev, więc
# nie wchodzi do grafu budowania biblioteki i nie odwraca warstw.
forge-model.workspace = true
