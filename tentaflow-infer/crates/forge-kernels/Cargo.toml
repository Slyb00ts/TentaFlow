# ===== File: Cargo.toml — forge-kernels: Mojo PTX artifact registry + typed launchers =====
[package]
name = "forge-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Backend AMD dla testów kerneli (kompilowane razem z CUDA, wybór w forge-hal::gpu).
hip = ["forge-hal/hip"]
# Kernele Metal (macOS). Zrodla MSL kompilowane przez backend przy ladowaniu.
metal = ["forge-hal/metal"]

[dependencies]
forge-types.workspace = true
forge-hal.workspace = true
forge-formats.workspace = true
forge-graph.workspace = true
half.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
