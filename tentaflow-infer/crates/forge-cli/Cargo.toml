# ===== File: Cargo.toml — forge-cli: the `forge` command (serve / run / bench) =====
[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[features]
# Backend AMD obok wkompilowanej na stałe CUDA (cudarc ładuje sterownik
# dynamicznie, więc jedna binarka obsługuje obie karty; wybór w forge-hal::gpu).
hip = ["forge-hal/hip"]

[dependencies]
forge-hal.workspace = true
forge-kernels.workspace = true
forge-types.workspace = true
forge-formats.workspace = true
forge-engine.workspace = true
forge-tokenize.workspace = true
forge-server.workspace = true
forge-whisper.workspace = true
forge-onnx.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
sha2 = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true
