# ===== File: Cargo.toml — forge-hal: hardware abstraction layer (Device/Stream/Event traits + CUDA/CPU backends) =====
[package]
name = "forge-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cuda"]
cuda = ["dep:cudarc"]
# Backend HIP/ROCm. Wymaga ROCm w czasie budowy (ROCM_PATH, domyślnie /opt/rocm).
hip = []

[dependencies]
forge-types.workspace = true
thiserror.workspace = true
tracing.workspace = true
cudarc = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
forge-types.workspace = true
