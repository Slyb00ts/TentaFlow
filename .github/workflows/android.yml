# =============================================================================
# File:        .github/workflows/android.yml
# Description: Builds the Android app (arm64-v8a). release.yml calls it and
#              publishes the APK next to the desktop archives, so a release is
#              installable on a phone too. The APK is debug-signed: it installs
#              by sideloading, a future properly signed build cannot upgrade it
#              in place, and Google Play refuses it. When a release keystore
#              exists, this job grows a signing step.
#
#              Also runs by hand and for pull requests that touch the mobile
#              app or the native-library scripts.
# =============================================================================
name: android

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tentaflow-mobile/**'
      - 'scripts/native-libs/**'
      - 'scripts/versions.env'
      - 'scripts/lib/versions.sh'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: build (arm64-v8a, unsigned)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # arm64-v8a only. It covers every phone anyone will test on, and each
      # further ABI is another full native build of whisper/ggml/GStreamer.
      - name: Install build dependencies
        run: |
          sudo apt-get update || sudo apt-get update || \
            echo "::warning::apt-get update failed — installing from existing lists"
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            python3 protobuf-compiler unzip curl git ca-certificates

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: WASM toolchain
        run: |
          # Without these, build.rs skips every bundled addon and the dashboard's
          # protocol glue — with a warning, not an error. The mobile app serves
          # that same dashboard through its webview, so an APK built without them
          # ships a UI that cannot load.
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          cargo install wasm-bindgen-cli --version "$(python3 scripts/workspace-version.py wasm-bindgen)" --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-android-${{ hashFiles('Cargo.lock') }}

      - name: Cache native-libs (android-arm64)
        uses: actions/cache@v4
        with:
          path: native-libs/android-arm64
          key: native-libs-android-arm64-${{ hashFiles('scripts/native-libs/**', 'scripts/build-zvec.sh', 'scripts/versions.env', 'scripts/lib/versions.sh') }}

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust core + native libraries
        env:
          ANDROID_ABIS: arm64-v8a
        run: |
          # The hosted image ships the NDK under $ANDROID_HOME/ndk/<version>,
          # which find_android_ndk already looks through — no third-party action
          # needed to place a toolchain.
          set -o pipefail
          bash tentaflow-mobile/android/scripts/build-rust.sh 2>&1 | tee build-rust.log

      - name: Quote the failed native build
        if: failure()
        run: |
          # Annotations are readable without the rights the job log needs.
          test -f build-rust.log || exit 0
          tail -n 80 build-rust.log | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > tail.txt
          echo "::error title=build-rust.sh::$(cat tail.txt)"

      - name: The JNI libraries must actually be there
        run: |
          # Gradle packages whatever sits in jniLibs without complaining about an
          # empty directory, so an APK missing its native core would build green
          # and crash at first launch.
          for lib in libtentaflow_mobile.so libc++_shared.so; do
            test -f "tentaflow-mobile/android/app/src/main/jniLibs/arm64-v8a/$lib" || {
              echo "::error::brak $lib w jniLibs/arm64-v8a"
              exit 1
            }
          done
          ls -lh tentaflow-mobile/android/app/src/main/jniLibs/arm64-v8a/

      - name: Gradle assembleDebug
        working-directory: tentaflow-mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK native libraries
        run: python3 scripts/ci-local/check-android-apk.py tentaflow-mobile/android/app/build/outputs/apk/debug/app-debug.apk --abi arm64-v8a

      - name: Name the APK like a release asset
        run: |
          # The release publishes every tentaflow-* artifact as it is, so the
          # file carries the tag, the ABI and the fact that it is debug-signed.
          mkdir -p dist
          apk="dist/tentaflow-${GITHUB_REF_NAME}-android-arm64-v8a-debug.apk"
          cp tentaflow-mobile/android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          (cd dist && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: tentaflow-android-arm64-v8a-debug
          path: |
            dist/tentaflow-*.apk
            dist/tentaflow-*.apk.sha256
