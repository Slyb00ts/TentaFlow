# =============================================================================
# File:        .github/workflows/release.yml
# Description: Builds the release artifacts for Linux x86_64 in two editions —
#              `full` (llama.cpp + whisper + vision on Vulkan) and `slim` (no
#              local inference engine at all) — and publishes them on a v* tag.
#
#              Every number and package in here was measured, not guessed:
#              scripts/ci-local/ reproduces this job in a container held to the
#              runner's shape. Cold native-libs 45m30s / 450 MB, cold release
#              build 45m / 299 MB binary / 9 GB target dir.
#
#              The runner is ubuntu-22.04, NOT ubuntu-latest. The glibc a binary
#              is linked against becomes the floor for every machine that later
#              installs it: 22.04 gives 2.35, 24.04 would demand 2.39 and lock
#              out Debian 12 (2.36), which install.sh claims to support.
#
#              macOS (Apple Silicon, Metal/MLX) builds in build-macos, `full`
#              only — see that job for why there is no macOS slim. Linux aarch64
#              and Windows are not built here yet; they come back one at a time,
#              each with a verified build, rather than as untested matrix rows.
# =============================================================================
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  TENTAFLOW_TARGET: x86_64-unknown-linux-gnu

jobs:
  # ---------------------------------------------------------------------------
  # native-libs — built once, shared by every edition in the matrix. Cached on
  # the build scripts plus the pinned llama.cpp ref, because a cold build is
  # 45 minutes and nothing about it changes between editions.
  # ---------------------------------------------------------------------------
  native-libs:
    name: native-libs (${{ matrix.platform }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CUDA 12.8 and 13.2 are both built because neither covers the fleet
          # alone: 13.x dropped everything below sm_75 and is the only line that
          # knows sm_103 (B300) and sm_121 (GB10 / DGX Spark), while 12.8 still
          # serves Turing through consumer Blackwell.
          - platform: linux-x86_64
            runner: ubuntu-22.04
            backend: vulkan
          - platform: linux-x86_64
            runner: ubuntu-22.04
            backend: cuda12
            cuda_apt: "12-8"
            cuda_arch: "sbsa_or_x86"
            cuda_archs: "75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual"
          - platform: linux-x86_64
            runner: ubuntu-22.04
            backend: cuda13
            cuda_apt: "13-2"
            cuda_archs: "75-real;80-real;86-real;89-real;90-real;100-real;103-real;120-real;121-real;121-virtual"
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            backend: vulkan
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            backend: cuda12
            cuda_apt: "12-8"
            cuda_archs: "80-real;86-real;87-real;89-real;90-real;100-real;120-real;120-virtual"
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            backend: cuda13
            cuda_apt: "13-2"
            cuda_archs: "87-real;90-real;100-real;103-real;110-real;120-real;121-real;121-virtual"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk before a CUDA toolkit lands on it
        if: startsWith(matrix.backend, 'cuda')
        run: |
          # A CUDA toolkit is 4-6 GB and the build tree another 9; the hosted
          # image ships ~25 GB of toolchains we never touch.
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          df -h /

      - name: Cache native-libs output
        id: cache
        uses: actions/cache@v4
        with:
          path: native-libs/${{ matrix.platform }}
          # The 4.2 GB of downloaded sources live outside the repo and are NOT
          # cached: only the built artifacts are, so the job stays clear of the
          # runner's disk ceiling. The backend is part of the key because the
          # same directory holds a different llama.cpp/whisper build per backend.
          key: native-libs-${{ matrix.platform }}-${{ matrix.backend }}-${{ hashFiles('scripts/native-libs/**', 'scripts/build-zvec.sh') }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The hosted image carries third-party apt sources (microsoft, docker,
          # git-core). One of them answering 404 or a hash mismatch makes
          # `apt-get update` exit 100, and with bash -e that kills the job even
          # though every package below lives in the Ubuntu archive. Retry, then
          # let the install be the step whose failure actually means something.
          sudo apt-get update || sudo apt-get update || sudo apt-get update || \
            echo "::warning::apt-get update nieudany 3x — instaluje z istniejacych list"
          sudo apt-get install -y \
            build-essential gcc-11 g++-11 ninja-build pkg-config \
            git curl wget ca-certificates unzip xz-utils \
            python3 python3-pip protobuf-compiler libssl-dev

      - name: Pin cmake into the window zvec requires
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # zvec declares cmake_minimum_required(3.26) and its submodules break
          # under cmake 4, so it needs [3.26, 4). Jammy ships 3.22 — too old —
          # and without this the build dies half-way through instead of running.
          pip3 install "cmake<4"
          cmake --version

      - name: Install the CUDA toolkit
        if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.backend, 'cuda')
        run: |
          # NVIDIA's repository is per architecture: x86_64 and sbsa (arm64).
          case "${{ matrix.platform }}" in
            linux-x86_64)  NV_ARCH=x86_64 ;;
            linux-aarch64) NV_ARCH=sbsa ;;
          esac
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/$NV_ARCH/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          # cuda-toolkit-<major>-<minor>, not `cuda`: the meta package would drag
          # in the driver, which a runner has no use for and no GPU to bind to.
          sudo apt-get install -y --no-install-recommends cuda-toolkit-${{ matrix.cuda_apt }}
          echo "/usr/local/cuda-$(echo ${{ matrix.cuda_apt }} | tr - .)/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-$(echo ${{ matrix.cuda_apt }} | tr - .)" >> "$GITHUB_ENV"
          df -h /

      - name: Build the Vulkan shader toolchain (arm64 has no LunarG SDK)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.backend == 'vulkan' && matrix.platform == 'linux-aarch64'
        run: |
          # LunarG ships no arm64 Linux SDK and jammy has no glslc package (it
          # arrives in 23.04), but llama.cpp's Vulkan backend compiles its
          # shaders with glslc and nothing else. Building the one tool we need
          # from shaderc is cheaper than moving the whole job to 24.04, which
          # would raise the glibc floor of every dylib this job produces.
          sudo apt-get install -y --no-install-recommends libvulkan-dev python3 git
          git clone --depth 1 --branch v2025.2 https://github.com/google/shaderc.git /tmp/shaderc
          cd /tmp/shaderc
          ./utils/git-sync-deps
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON -DSHADERC_SKIP_COPYRIGHT_CHECK=ON
          # The executable target is `glslc_exe`; plain `glslc` is the static
          # library it links against, and building that one succeeds while
          # producing no tool at all.
          cmake --build build --target glslc_exe -j"$(nproc)"
          sudo install -m755 build/glslc/glslc /usr/local/bin/glslc
          glslc --version

          # ggml-vulkan also does find_package(SPIRV-Headers CONFIG REQUIRED),
          # and jammy's spirv-headers deb ships headers with no CMake config, so
          # apt cannot satisfy it. git-sync-deps already fetched the sources
          # above; installing them supplies the config package the SDK would.
          cmake -S third_party/spirv-headers -B build-spirv-headers -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          sudo cmake --install build-spirv-headers
          find /usr/local -name 'SPIRV-HeadersConfig.cmake' | grep -q . \
            || { echo "::error::SPIRV-Headers CMake config was not installed"; exit 1; }

      - name: Install Vulkan SDK
        if: steps.cache.outputs.cache-hit != 'true' && matrix.backend == 'vulkan' && matrix.platform == 'linux-x86_64'
        run: |
          # glslc decides whether the vulkan backend exists at all: without it
          # detect_backends() silently produces a CPU-only 'multi' variant and
          # the artifact named gpu-vulkan is llama.cpp on the CPU.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-${CODENAME}.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslc --version

      - name: Build native-libs
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # Backends are FORCED, never detected: a runner has no GPU, so
          # `auto` silently produces a CPU-only build and the artifact named
          # cuda would be llama.cpp on the processor.
          LLAMA_CPP_BACKENDS: ${{ startsWith(matrix.backend, 'cuda') && 'cuda' || 'vulkan' }}
          WHISPER_CPP_BACKENDS: ${{ startsWith(matrix.backend, 'cuda') && 'cuda' || 'vulkan' }}
          CMAKE_CUDA_ARCHITECTURES: ${{ matrix.cuda_archs }}
          # The GPU variant of onnxruntime pulls CUDA/TensorRT providers and
          # inflates lib-dynamic past 3 GB; the vision CUDA path is a separate
          # step (see the release notes) and is not part of this artifact yet.
          ONNXRUNTIME_GPU: "0"
        run: |
          df -h /
          time ./scripts/native-libs/build-all.sh --platform ${{ matrix.platform }}
          df -h /

      - name: The requested backend must actually be in the artifact
        run: |
          # An artifact named cuda that holds only libggml-cpu.a is the failure
          # mode this whole job exists to prevent, and it is silent otherwise.
          case "${{ matrix.backend }}" in
            vulkan) WANT=libggml-vulkan.a ;;
            *)      WANT=libggml-cuda.a ;;
          esac
          FOUND=$(find native-libs/${{ matrix.platform }}/lib-static/llama-cpp -name "$WANT" | head -1)
          test -n "$FOUND" || {
            echo "::error::$WANT nie powstal — backend ${{ matrix.backend }} nie zostal zbudowany"
            find native-libs/${{ matrix.platform }}/lib-static/llama-cpp -name 'libggml-*.a' || true
            exit 1
          }
          ls -lh "$FOUND"

      - uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ matrix.platform }}-${{ matrix.backend }}
          path: native-libs/${{ matrix.platform }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # build — one job per edition. Both link the same native-libs.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.platform }}, ${{ matrix.asset }})
    needs: native-libs
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset` is the suffix in the archive name and the `variant` written
          # into the install receipt, which is what `tentaflow update` uses to
          # pick its download. Renaming one without the other breaks updates.
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            edition: slim
            asset: slim
            nl_backend: vulkan
            llama_variant: multi
            cargo_flags: "--no-default-features"
            expect: "libzvec_c_api.so"
            forbid_cuda: "yes"
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            edition: full
            asset: full-vulkan
            nl_backend: vulkan
            llama_variant: multi
            cargo_flags: "--features gpu-vulkan"
            expect: "libvulkan.so.1 libwhisper_tf.so libzvec_c_api.so"
            forbid_cuda: "yes"
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            edition: full
            asset: full-cuda12
            nl_backend: cuda12
            llama_variant: cuda
            cuda_apt: "12-8"
            cargo_flags: "--features gpu-vulkan"
            expect: "libcudart.so libwhisper_tf.so libzvec_c_api.so"
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            edition: full
            asset: full-cuda13
            nl_backend: cuda13
            llama_variant: cuda
            cuda_apt: "13-2"
            cargo_flags: "--features gpu-vulkan"
            expect: "libcudart.so libwhisper_tf.so libzvec_c_api.so"
          - platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            edition: slim
            asset: slim
            nl_backend: vulkan
            llama_variant: multi
            cargo_flags: "--no-default-features"
            expect: "libzvec_c_api.so"
            forbid_cuda: "yes"
          - platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            edition: full
            asset: full-vulkan
            nl_backend: vulkan
            llama_variant: multi
            cargo_flags: "--features gpu-vulkan"
            expect: "libvulkan.so.1 libwhisper_tf.so libzvec_c_api.so"
            forbid_cuda: "yes"
          - platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            edition: full
            asset: full-cuda12
            nl_backend: cuda12
            llama_variant: cuda
            cuda_apt: "12-8"
            cargo_flags: "--features gpu-vulkan"
            expect: "libcudart.so libwhisper_tf.so libzvec_c_api.so"
          - platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            edition: full
            asset: full-cuda13
            nl_backend: cuda13
            llama_variant: cuda
            cuda_apt: "13-2"
            cargo_flags: "--features gpu-vulkan"
            expect: "libcudart.so libwhisper_tf.so libzvec_c_api.so"

    env:
      TENTAFLOW_TARGET: ${{ matrix.target }}
      # Which native-libs subdirectory the vendored -sys crates link against.
      # Without these the build silently takes `multi` (the Vulkan/CPU set) and
      # the artifact named cuda would contain no CUDA at all.
      LLAMA_CPP_NATIVE_VARIANT: ${{ matrix.llama_variant }}
      WHISPER_CPP_NATIVE_VARIANT: ${{ matrix.llama_variant }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk before a CUDA toolkit lands on it
        if: matrix.cuda_apt != ''
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell || true
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: native-libs-${{ matrix.platform }}-${{ matrix.nl_backend }}
          path: native-libs/${{ matrix.platform }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the CUDA toolkit
        if: matrix.cuda_apt != ''
        run: |
          # Linking libggml-cuda.a needs -lcudart and -lcublas, so the toolkit is
          # a BUILD dependency here even though no GPU is present.
          case "${{ matrix.platform }}" in
            linux-x86_64)  NV_ARCH=x86_64 ;;
            linux-aarch64) NV_ARCH=sbsa ;;
          esac
          wget -q "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/$NV_ARCH/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cuda-toolkit-${{ matrix.cuda_apt }}
          CUDA_DIR="/usr/local/cuda-$(echo ${{ matrix.cuda_apt }} | tr - .)"
          echo "$CUDA_DIR/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=$CUDA_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CUDA_DIR/lib64" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          # The hosted image carries third-party apt sources (microsoft, docker,
          # git-core). One of them answering 404 or a hash mismatch makes
          # `apt-get update` exit 100, and with bash -e that kills the job even
          # though every package below lives in the Ubuntu archive. Retry, then
          # let the install be the step whose failure actually means something.
          sudo apt-get update || sudo apt-get update || sudo apt-get update || \
            echo "::warning::apt-get update nieudany 3x — instaluje z istniejacych list"
          # The hosted image preinstalls LLVM's libunwind-14-dev, which Breaks
          # Ubuntu's libunwind-dev — the exact package libgstreamer1.0-dev
          # depends on, so the install dies with "held broken packages". LLVM's
          # unwinder is used by nothing we build; removing it is the way out.
          sudo apt-get remove -y libunwind-14-dev || true
          # libasound2-dev: sherpa-rs links -lasound.
          # libvulkan-dev: LunarG's vulkan-sdk ships glslc and headers but no
          # libvulkan.so to link against, so the final link fails on -lvulkan.
          sudo apt-get install -y \
            build-essential cmake pkg-config protobuf-compiler \
            libssl-dev libasound2-dev libvulkan-dev \
            libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            clang libclang-dev git curl ca-certificates

      - name: WASM toolchain
        run: |
          # Without these the dashboard glue (wasm_glue_bg.wasm) and every
          # bundled addon are skipped by build.rs — with a warning, not an
          # error, so the release would ship a dashboard that cannot load.
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          cargo install wasm-bindgen-cli --version 0.2.125 --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.platform }}-${{ matrix.asset }}-${{ hashFiles('**/Cargo.lock') }}
          # Any lockfile change invalidates the exact key; without a fallback the
          # whole dependency tree rebuilds from zero, which on macOS cost five
          # hours and nearly hit the six-hour job limit.
          restore-keys: |
            cargo-${{ matrix.platform }}-${{ matrix.asset }}-
            cargo-${{ matrix.platform }}-

      - name: Build
        working-directory: tentaflow
        env:
          # whisper-rs-sys and llama-cpp-sys-2 each bundle a ggml copy, so the
          # linker sees multiple definitions of every quantize_* symbol. Taking
          # the first is safe — they are binary-identical.
          RUSTFLAGS: "-C link-arg=-Wl,--allow-multiple-definition"
        run: |
          df -h /
          time cargo build --release --target "$TENTAFLOW_TARGET" ${{ matrix.cargo_flags }}
          df -h /

      - name: Stage archive
        id: stage
        run: |
          # The target directory is resolved, never hardcoded: .cargo/config.toml
          # redirects it to target_shared and a hardcoded path silently staged
          # nothing for months.
          TARGET_DIR=$(cd tentaflow && cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          OUT="$TARGET_DIR/$TENTAFLOW_TARGET/release"
          STAGE="tentaflow-${GITHUB_REF_NAME}-${TENTAFLOW_TARGET}-${{ matrix.asset }}"
          mkdir -p "$STAGE"

          # Everything the binary needs and no package manager can provide. A
          # missing file fails the job: shipping an archive whose binary cannot
          # start is worse than shipping nothing.
          require() {
            test -f "$1" || { echo "::error::missing required artifact: $1"; exit 1; }
            cp "$1" "$STAGE/"
          }
          require "$OUT/tentaflow"
          require "native-libs/${{ matrix.platform }}/lib-dynamic/libzvec_c_api.so"
          # pdfium is a mandatory dependency loaded at runtime (bind_to_library),
          # not a feature — document ingest needs it in both editions.
          require "native-libs/${{ matrix.platform }}/lib-dynamic/libpdfium.so"
          require "scripts/install/tentaflow.service.in"
          require "LICENSE"
          require "README.md"
          # The meeting sidecar goes in BOTH editions. `slim` means no local
          # inference engine, not fewer features: core's meeting module is not
          # feature-gated, the bot reaches models through FlowInvoke — which slim
          # answers with cloud providers — and the binary needs nothing beyond
          # libc, so there is no technical reason to withhold it.
          require "$OUT/tentaflow-meeting"

          # No silero_vad.onnx here: nothing in the build produces one, and
          # Core downloads it (with the wespeaker embedding) on first start into
          # <data>/models/audio. `required_assets` only prefers a repo copy when
          # it is running from a source checkout, which an installation is not.
          if [ "${{ matrix.edition }}" = "full" ]; then
            require "$OUT/libwhisper_tf.so"
            require "native-libs/${{ matrix.platform }}/lib-dynamic/libonnxruntime.so.1.26.0"
          fi

          tar -czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          ls -lh "$STAGE.tar.gz"

      - name: Verify the binary links what it should
        run: |
          BIN="${{ steps.stage.outputs.stage }}/tentaflow"
          readelf -d "$BIN" | grep NEEDED
          for lib in ${{ matrix.expect }}; do
            readelf -d "$BIN" | grep -q "\[$lib\]" || {
              echo "::error::$BIN does not link $lib"
              exit 1
            }
          done
          # A CUDA link in a portable build means the artifact cannot start on a
          # machine without the NVIDIA stack — so the vulkan and slim variants
          # must have none, and the cuda ones must have it (checked above).
          if [ "${{ matrix.forbid_cuda }}" = "yes" ] \
             && readelf -d "$BIN" | grep -qE "libcud(art|a)|libcublas"; then
            echo "::error::$BIN links CUDA — this variant must not"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tentaflow-${{ matrix.platform }}-${{ matrix.asset }}
          path: |
            tentaflow-*.tar.gz
            tentaflow-*.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # build-macos — Apple Silicon, `full` only.
  #
  # There is no macOS `slim`: tentaflow/Cargo.toml pulls tentaflow-core with the
  # MLX features from a [target.'cfg(target_os = "macos")'] block, which applies
  # regardless of --no-default-features, so a "slim" macOS build would ship the
  # same MLX engines under a name that promises none. Making it real means
  # restructuring that dependency, which is not something to do blind.
  #
  # Intel Macs are not built: nothing in this repo has been measured on one.
  # ---------------------------------------------------------------------------
  build-macos:
    name: build (macos-full)
    # macos-26, not macos-14. Our Swift packages declare tools-version 6.1
    # (MLXBridge) and 6.2 (vendored MisakiSwift), and KokoroBridge/Misaki target
    # .macOS(.v15) — an Xcode 15 runner cannot even parse those manifests, which
    # is why the first attempt produced a binary with no MLX bridge at all.
    runs-on: macos-26
    env:
      TENTAFLOW_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkg-config glib gstreamer gst-plugins-base protobuf

      - name: Toolchain must be new enough for our Swift packages
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version
          swift --version
          # MLXBridge is tools-version 6.1 and the vendored MisakiSwift is 6.2;
          # an older Swift fails to READ the manifest, so check before spending
          # three hours compiling Rust for a binary that would ship no MLX.
          SWIFT_VER=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)
          MIN=6.1
          if [ "$(printf '%s\n%s\n' "$MIN" "$SWIFT_VER" | sort -V | head -1)" != "$MIN" ]; then
            echo "::error::Swift $SWIFT_VER < $MIN — MLXBridge/MisakiSwift nie zbuduja sie na tym runnerze"
            exit 1
          fi

      - name: Metal toolchain
        run: |
          # Xcode 26 split the Metal compiler into a downloadable component.
          # Without it xcodebuild produces a BROKEN mlx.metallib and every MLX
          # model returns gibberish — with no build error. Fail loudly instead.
          if ! xcrun --sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          cargo install wasm-bindgen-cli --version 0.2.125 --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-macos-${{ hashFiles('**/Cargo.lock') }}

      - name: Build native-libs
        run: ./scripts/native-libs/build-all.sh --platform macos-arm64

      - name: Swift bridges (fail fast, before three hours of Rust)
        run: |
          # build.rs builds these too and reuses this derived data. Doing it here
          # first means a broken Swift toolchain costs ten minutes instead of a
          # full compile that then fails at packaging.
          for pkg in MLXBridge KokoroBridge; do
            ( cd "tentaflow-desktop/macos/swift/$pkg" \
              && xcodebuild -scheme "$pkg" -destination 'platform=macOS,arch=arm64' \
                   -configuration Release -skipMacroValidation \
                   -derivedDataPath build-xcode build )
          done

      - name: Build
        working-directory: tentaflow
        run: cargo build --release --target "$TENTAFLOW_TARGET" --features gpu-metal

      - name: Stage archive
        id: stage
        run: |
          TARGET_DIR=$(cd tentaflow && cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          OUT="$TARGET_DIR/$TENTAFLOW_TARGET/release"
          STAGE="tentaflow-${GITHUB_REF_NAME}-${TENTAFLOW_TARGET}-full-metal"
          mkdir -p "$STAGE"

          require() {
            test -e "$1" || { echo "::error::missing required artifact: $1"; exit 1; }
            cp -R "$1" "$STAGE/"
          }
          require "$OUT/tentaflow"
          require "$OUT/libzvec_c_api.dylib"
          require "$OUT/libpdfium.dylib"
          # MLX is the whole reason this edition exists on macOS: the bridge
          # dylib without its metallib bundle loads and then computes garbage,
          # so both are mandatory, not best-effort.
          require "$OUT/libMLXBridge.dylib"
          require "$OUT/mlx-swift_Cmlx.bundle"
          require "$OUT/libKokoroBridge.dylib"
          require "scripts/install/ai.tentaflow.plist.in"
          require "LICENSE"
          require "README.md"

          tar -czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          ls -lh "$STAGE.tar.gz"

      - name: Verify the binary loads what it should
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          BIN="$STAGE/tentaflow"
          otool -L "$BIN"
          file "$BIN" | grep -q arm64 || { echo "::error::not an arm64 binary"; exit 1; }

          # zvec is linked at build time, through @rpath next to the binary.
          otool -L "$BIN" | grep -q libzvec_c_api.dylib || {
            echo "::error::$BIN does not link libzvec_c_api.dylib"; exit 1;
          }

          # The Swift bridges are NOT linked — core dlopens them (libloading,
          # see stt/mlx_whisper.rs), so they never appear in the load commands.
          # What matters is that they are in the archive, are arm64, and carry an
          # @rpath install name so dlopen finds them beside the binary.
          for lib in libMLXBridge.dylib libKokoroBridge.dylib; do
            test -f "$STAGE/$lib" || { echo "::error::brak $lib w archiwum"; exit 1; }
            file "$STAGE/$lib" | grep -q arm64 || {
              echo "::error::$lib nie jest arm64"; exit 1;
            }
            otool -D "$STAGE/$lib" | grep -q "@rpath/$lib" || {
              echo "::error::$lib ma zly install name (dlopen go nie znajdzie)"
              otool -D "$STAGE/$lib"
              exit 1
            }
          done
          # The metallib bundle is what makes MLX compute correct results rather
          # than gibberish; the dylib alone is not enough.
          test -d "$STAGE/mlx-swift_Cmlx.bundle" || {
            echo "::error::brak mlx-swift_Cmlx.bundle — MLX zwracalby bledne wyniki"; exit 1;
          }

      - uses: actions/upload-artifact@v4
        with:
          name: tentaflow-macos-arm64-full-metal
          path: |
            tentaflow-*.tar.gz
            tentaflow-*.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # verify — install the artifact the way a user will and prove the claims the
  # README makes: the service registers, autostarts, answers /health, and the
  # CLI reports it. A GitHub runner has real systemd, so this is the actual
  # install path, not a simulation of it. It gates publish: an archive that
  # cannot install is not a release.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (${{ matrix.platform }}, ${{ matrix.asset }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the variants a GPU-less runner can actually RUN. A CUDA build
          # installs fine and then fails to start for want of libcudart, which
          # would report a packaging problem that is not one — those variants are
          # verified by their NEEDED list at build time instead.
          - platform: linux-x86_64
            runner: ubuntu-22.04
            asset: slim
            edition: slim
          - platform: linux-x86_64
            runner: ubuntu-22.04
            asset: full-vulkan
            edition: full
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            asset: slim
            edition: slim
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            asset: full-vulkan
            edition: full
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tentaflow-${{ matrix.platform }}-${{ matrix.asset }}
          path: dist

      - name: Install from the archive
        env:
          TENTAFLOW_EDITION: ${{ matrix.edition }}
        run: |
          ARCHIVE=$(ls dist/*.tar.gz)
          sudo -E env TENTAFLOW_ASSET_FILE="$PWD/$ARCHIVE" \
            sh scripts/install/install.sh

      - name: The service must be enabled, running and answering
        run: |
          systemctl is-enabled tentaflow.service
          for _ in $(seq 1 30); do
            systemctl is-active --quiet tentaflow.service && break
            sleep 2
          done
          systemctl is-active tentaflow.service
          tentaflow status
          # The status line is human-readable; this is the assertion. First boot
          # generates a TLS identity and a database before the socket opens.
          for _ in $(seq 1 60); do
            curl -fsk https://127.0.0.1:8090/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsk https://127.0.0.1:8090/health >/dev/null
          test -f /etc/tentaflow/config.toml
          test -f /etc/tentaflow/install-receipt.json

      - name: Dump the journal when it did not come up
        if: failure()
        run: sudo journalctl -u tentaflow.service --no-pager -n 200

      - name: Uninstall must leave nothing behind
        run: |
          sudo sh scripts/install/uninstall.sh --purge
          ! systemctl is-enabled tentaflow.service 2>/dev/null
          test ! -e /opt/tentaflow

  publish:
    needs: [build, build-macos, verify]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # Only the release archives. Without a pattern this also pulled the
          # native-libs artifacts, and their manifest.toml was published as a
          # release asset — a stray file next to the archives.
          pattern: tentaflow-*
          path: dist
          merge-multiple: true

      - name: Check the tag matches the crate version
        run: |
          CRATE=$(grep -m1 '^version' tentaflow/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          test "v$CRATE" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match tentaflow/Cargo.toml version $CRATE"
            exit 1
          }

      - name: Copy installers next to the archives
        run: cp scripts/install/install.sh scripts/install/uninstall.sh dist/

      - name: Detect pre-release tag
        id: prerelease
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) echo "value=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
