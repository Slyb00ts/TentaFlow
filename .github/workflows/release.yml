# =============================================================================
# File:        .github/workflows/release.yml
# Description: Builds the release artifacts for Linux x86_64 in two editions —
#              `full` (llama.cpp + whisper + vision on Vulkan) and `slim` (no
#              local inference engine at all) — and publishes them on a v* tag.
#
#              Every number and package in here was measured, not guessed:
#              scripts/ci-local/ reproduces this job in a container held to the
#              runner's shape. Cold native-libs 45m30s / 450 MB, cold release
#              build 45m / 299 MB binary / 9 GB target dir.
#
#              The runner is ubuntu-22.04, NOT ubuntu-latest. The glibc a binary
#              is linked against becomes the floor for every machine that later
#              installs it: 22.04 gives 2.35, 24.04 would demand 2.39 and lock
#              out Debian 12 (2.36), which install.sh claims to support.
#
#              macOS (Metal/MLX), aarch64 and Windows are not built here yet.
#              Their steps are in git history; they come back one at a time,
#              each with a verified build, rather than as untested matrix rows.
# =============================================================================
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  TENTAFLOW_TARGET: x86_64-unknown-linux-gnu

jobs:
  # ---------------------------------------------------------------------------
  # native-libs — built once, shared by every edition in the matrix. Cached on
  # the build scripts plus the pinned llama.cpp ref, because a cold build is
  # 45 minutes and nothing about it changes between editions.
  # ---------------------------------------------------------------------------
  native-libs:
    name: native-libs (linux-x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache native-libs output
        id: cache
        uses: actions/cache@v4
        with:
          path: native-libs/linux-x86_64
          # The 4.2 GB of downloaded sources live outside the repo and are NOT
          # cached: only the 450 MB of built artifacts are, so the release job
          # stays clear of the runner's ~14 GB disk ceiling.
          key: native-libs-linux-x86_64-${{ hashFiles('scripts/native-libs/**', 'scripts/build-zvec.sh') }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-11 g++-11 ninja-build pkg-config \
            git curl wget ca-certificates unzip xz-utils \
            python3 python3-pip protobuf-compiler libssl-dev

      - name: Pin cmake into the window zvec requires
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # zvec declares cmake_minimum_required(3.26) and its submodules break
          # under cmake 4, so it needs [3.26, 4). Jammy ships 3.22 — too old —
          # and without this the build dies half-way through instead of running.
          pip3 install "cmake<4"
          cmake --version

      - name: Install Vulkan SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # glslc decides whether the vulkan backend exists at all: without it
          # detect_backends() silently produces a CPU-only 'multi' variant and
          # the artifact named gpu-vulkan is llama.cpp on the CPU.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-${CODENAME}.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslc --version

      - name: Build native-libs
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # The GPU variant of onnxruntime pulls CUDA/TensorRT providers and
          # inflates lib-dynamic to ~3.3 GB for a build that has no CUDA in it.
          ONNXRUNTIME_GPU: "0"
        run: |
          df -h /
          time ./scripts/native-libs/build-all.sh --platform linux-x86_64
          df -h /

      - name: Verify the vulkan backend was actually built
        run: |
          ART=native-libs/linux-x86_64/lib-static/llama-cpp/multi/libggml-vulkan.a
          test -f "$ART" || {
            echo "::error::$ART missing — the vulkan backend was not built"
            exit 1
          }
          ls -lh "$ART"

      - uses: actions/upload-artifact@v4
        with:
          name: native-libs-linux-x86_64
          path: native-libs/linux-x86_64
          retention-days: 1

  # ---------------------------------------------------------------------------
  # build — one job per edition. Both link the same native-libs.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.edition }})
    needs: native-libs
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: full
            cargo_flags: "--features gpu-vulkan"
            # NEEDED entries that must be present, one per line.
            expect: "libvulkan.so.1 libwhisper_tf.so libzvec_c_api.so"
          - edition: slim
            cargo_flags: "--no-default-features"
            expect: "libzvec_c_api.so"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: native-libs-linux-x86_64
          path: native-libs/linux-x86_64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TENTAFLOW_TARGET }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libasound2-dev: sherpa-rs links -lasound.
          # libvulkan-dev: LunarG's vulkan-sdk ships glslc and headers but no
          # libvulkan.so to link against, so the final link fails on -lvulkan.
          sudo apt-get install -y \
            build-essential cmake pkg-config protobuf-compiler \
            libssl-dev libasound2-dev libvulkan-dev \
            libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            clang libclang-dev git curl ca-certificates

      - name: WASM toolchain
        run: |
          # Without these the dashboard glue (wasm_glue_bg.wasm) and every
          # bundled addon are skipped by build.rs — with a warning, not an
          # error, so the release would ship a dashboard that cannot load.
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          cargo install wasm-bindgen-cli --version 0.2.125 --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.edition }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Download Silero VAD (teams-bot native)
        run: |
          MODEL_DIR="tentaflow-containers/agents/native/teams-bot/models"
          mkdir -p "$MODEL_DIR"
          curl -fL "https://github.com/snakers4/silero-vad/raw/v5.1/src/silero_vad/data/silero_vad.onnx" \
            -o "$MODEL_DIR/silero_vad.onnx"

      - name: Build
        working-directory: tentaflow
        env:
          # whisper-rs-sys and llama-cpp-sys-2 each bundle a ggml copy, so the
          # linker sees multiple definitions of every quantize_* symbol. Taking
          # the first is safe — they are binary-identical.
          RUSTFLAGS: "-C link-arg=-Wl,--allow-multiple-definition"
        run: |
          df -h /
          time cargo build --release --target "$TENTAFLOW_TARGET" ${{ matrix.cargo_flags }}
          df -h /

      - name: Stage archive
        id: stage
        run: |
          # The target directory is resolved, never hardcoded: .cargo/config.toml
          # redirects it to target_shared and a hardcoded path silently staged
          # nothing for months.
          TARGET_DIR=$(cd tentaflow && cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          OUT="$TARGET_DIR/$TENTAFLOW_TARGET/release"
          STAGE="tentaflow-${GITHUB_REF_NAME}-${TENTAFLOW_TARGET}-${{ matrix.edition }}"
          mkdir -p "$STAGE"

          # Everything the binary needs and no package manager can provide. A
          # missing file fails the job: shipping an archive whose binary cannot
          # start is worse than shipping nothing.
          require() {
            test -f "$1" || { echo "::error::missing required artifact: $1"; exit 1; }
            cp "$1" "$STAGE/"
          }
          require "$OUT/tentaflow"
          require "native-libs/linux-x86_64/lib-dynamic/libzvec_c_api.so"
          # pdfium is a mandatory dependency loaded at runtime (bind_to_library),
          # not a feature — document ingest needs it in both editions.
          require "native-libs/linux-x86_64/lib-dynamic/libpdfium.so"
          require "scripts/install/tentaflow.service.in"
          require "LICENSE"
          require "README.md"

          if [ "${{ matrix.edition }}" = "full" ]; then
            require "$OUT/libwhisper_tf.so"
            require "$OUT/tentaflow-meeting"
            require "$OUT/silero_vad.onnx"
            require "native-libs/linux-x86_64/lib-dynamic/libonnxruntime.so.1.26.0"
          fi

          tar -czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          ls -lh "$STAGE.tar.gz"

      - name: Verify the binary links what it should
        run: |
          BIN="${{ steps.stage.outputs.stage }}/tentaflow"
          readelf -d "$BIN" | grep NEEDED
          for lib in ${{ matrix.expect }}; do
            readelf -d "$BIN" | grep -q "\[$lib\]" || {
              echo "::error::$BIN does not link $lib"
              exit 1
            }
          done
          # A CUDA link in a Vulkan build means the artifact cannot start on a
          # machine without the NVIDIA driver — libcuda.so.1 comes from it.
          if readelf -d "$BIN" | grep -qE "libcud(art|a)|libcublas"; then
            echo "::error::$BIN links CUDA — this edition must not"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tentaflow-${{ matrix.edition }}
          path: |
            tentaflow-*.tar.gz
            tentaflow-*.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # verify — install the artifact the way a user will and prove the claims the
  # README makes: the service registers, autostarts, answers /health, and the
  # CLI reports it. A GitHub runner has real systemd, so this is the actual
  # install path, not a simulation of it. It gates publish: an archive that
  # cannot install is not a release.
  # ---------------------------------------------------------------------------
  verify:
    name: verify (${{ matrix.edition }})
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        edition: [full, slim]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tentaflow-${{ matrix.edition }}
          path: dist

      - name: Install from the archive
        env:
          TENTAFLOW_EDITION: ${{ matrix.edition }}
        run: |
          ARCHIVE=$(ls dist/*.tar.gz)
          sudo -E env TENTAFLOW_ASSET_FILE="$PWD/$ARCHIVE" \
            sh scripts/install/install.sh

      - name: The service must be enabled, running and answering
        run: |
          systemctl is-enabled tentaflow.service
          for _ in $(seq 1 30); do
            systemctl is-active --quiet tentaflow.service && break
            sleep 2
          done
          systemctl is-active tentaflow.service
          tentaflow status
          # The status line is human-readable; this is the assertion. First boot
          # generates a TLS identity and a database before the socket opens.
          for _ in $(seq 1 60); do
            curl -fsk https://127.0.0.1:8090/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsk https://127.0.0.1:8090/health >/dev/null
          test -f /etc/tentaflow/config.toml
          test -f /etc/tentaflow/install-receipt.json

      - name: Dump the journal when it did not come up
        if: failure()
        run: sudo journalctl -u tentaflow.service --no-pager -n 200

      - name: Uninstall must leave nothing behind
        run: |
          sudo sh scripts/install/uninstall.sh --purge
          ! systemctl is-enabled tentaflow.service 2>/dev/null
          test ! -e /opt/tentaflow

  publish:
    needs: [build, verify]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag matches the crate version
        run: |
          CRATE=$(grep -m1 '^version' tentaflow/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          test "v$CRATE" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME does not match tentaflow/Cargo.toml version $CRATE"
            exit 1
          }

      - name: Copy installers next to the archives
        run: cp scripts/install/install.sh scripts/install/uninstall.sh dist/

      - name: Detect pre-release tag
        id: prerelease
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) echo "value=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ steps.prerelease.outputs.value }}
          generate_release_notes: true
