[package]
name = "tentaflow-macros"
version = "0.1.0"
edition = "2021"
authors = ["TentaFlow"]
description = "Proc-macro: #[handler] + #[policy] + #[observed] dla WSS dispatch"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["full", "extra-traits"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
