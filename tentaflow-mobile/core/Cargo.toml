[package]
name = "tentaflow-mobile"
version = "0.1.0"
edition = "2021"
description = "TentaFlow Mobile — iOS/Android z mesh networking i lokalnym LLM"

[lib]
name = "tentaflow_mobile"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Wspolna baza mobilna (iOS + Android). default-features = false; whisper.cpp
# dokladany TYLKO na Android (blok nizej) — na iOS STT leci MLX-whisper / natywny
# Swift (TentaFlowAI/Whisper/*), wiec whisper.cpp sie tam nie linkuje.
# `camera` (GStreamer) zostawiamy — apka mobilna uczestniczy w pipeline video
# i wymaga GStreamer SDK podpietego w buildzie platformy.
tentaflow-core = { path = "../../tentaflow-core", default-features = false, features = ["camera", "docker", "inference-llamacpp"] }
# tentaflow-ui (egui/wgpu) usuniete z mobile — UI idzie przez webview (SwiftUI),
# egui app (run_gui) byl martwym kodem (nigdy nie wolany). To wycina tez
# eframe/egui/wgpu z buildu mobile.

tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dirs = "6.0.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
hex = "0.4"
data-encoding = "2"

# iOS (device + symulator): MLX bridge to lekkie FFI po stronie Rust (Swift
# dostarcza implementacje w apce), wiec dziala na obu.
[target.'cfg(target_os = "ios")'.dependencies]
tentaflow-core = { path = "../../tentaflow-core", default-features = false, features = ["camera", "docker", "inference-llamacpp", "inference-mlx", "inference-mlx-whisper", "inference-mlx-kokoro"] }

# inference-sherpa TYLKO na device (nie symulator). sherpa-rs-sys pobiera prebuilt
# onnxruntime.a; slice symulatora to FAT archive (arm64+x86_64), ktorego cargo
# nie potrafi zlinkowac ("Unsupported archive identifier"). Symulator i tak nie
# uruchamia MLX, wiec sherpa jest tam zbedny. target_abi="sim" odroznia symulator.
[target.'cfg(all(target_os = "ios", not(target_abi = "sim")))'.dependencies]
tentaflow-core = { path = "../../tentaflow-core", default-features = false, features = ["inference-sherpa"] }

# Android: whisper.cpp (STT) ZAWSZE wbudowany — engine `whisper` musi byc
# dostepny w runtime. UWAGA: ten target linkuje statycznie llama.cpp
# (inference-llamacpp z bazy) ORAZ whisper.cpp; oba wnosza symbole ggml. Na
# Androidzie nie ma backendu CUDA, wiec kolizja ggml-cuda nie zachodzi, ale
# pilnuj zeby nie wlaczac tu gpu-cuda na obu silnikach jednoczesnie.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
log = "0.4"
jni = "0.21"
tentaflow-core = { path = "../../tentaflow-core", default-features = false, features = ["inference-whisper"] }
