[workspace]
members = ["core"]
resolver = "2"

# Mobile to osobny workspace, więc patche z głównego workspace'u tu nie obowiązują.
# Bez tego cargo bierze upstreamowe -sys z crates.io i kompiluje natywne biblioteki
# OD ZERA. Przekierowanie na vendored sprawia, że build linkuje gotowe biblioteki
# z native-libs/* zamiast budować ze źródeł.
[patch.crates-io]
llama-cpp-sys-2 = { path = "../vendor/crates/llama-cpp-sys-2" }
sherpa-rs-sys = { path = "../vendor/crates/sherpa-rs-sys" }
whisper-rs-sys = { path = "../vendor/crates/whisper-rs-sys" }
# aarch64 c_char fix — upstream 0.9.2 hardcodes `*const i8`, and c_char is
# UNSIGNED on aarch64 (Android and Linux alike), so the cast does not compile
# there. The main workspace already patches this; a separate workspace does not
# inherit it, which is exactly how the Android build got the broken upstream.
pdfium-render = { path = "../vendor/crates/pdfium-render" }
