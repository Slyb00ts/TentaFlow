[package]
name = "burn-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
burn = { workspace = true, features = ["std", "wgpu", "ndarray"] }
burn-store = { workspace = true, default-features = true }
burn-onnx = { workspace = true }
image = { workspace = true, default-features = true }

[[bin]]
name = "burn-spike"
path = "src/main.rs"

[[bin]]
name = "onnx2bpk"
path = "src/onnx2bpk.rs"

[[bin]]
name = "onnx2gen"
path = "src/onnx2gen.rs"

[[bin]]
name = "roundtrip-rfdetr"
path = "src/roundtrip_rfdetr.rs"

[[bin]]
name = "roundtrip-stan"
path = "src/roundtrip_stan.rs"

[[bin]]
name = "gpu-forward"
path = "src/gpu_forward.rs"

[features]
default = []
cuda = ["burn/cuda"]
vulkan = ["burn/vulkan"]
wgpuf16 = []
