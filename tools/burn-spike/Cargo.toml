[package]
name = "burn-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
burn = { version = "0.21", features = ["wgpu", "ndarray"] }
burn-store = "0.21"
burn-onnx = "0.21"
image = "0.25"

[[bin]]
name = "burn-spike"
path = "src/main.rs"

[[bin]]
name = "onnx2bpk"
path = "src/onnx2bpk.rs"

[[bin]]
name = "roundtrip-rfdetr"
path = "src/roundtrip_rfdetr.rs"

[features]
default = []
cuda = ["burn/cuda"]
vulkan = ["burn/vulkan"]
wgpuf16 = []
