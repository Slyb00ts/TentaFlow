# =============================================================================
# Crate: tentaflow-hardware
# Purpose: Native device/robot integrations for TentaFlow, organized by vendor
#          (src/<vendor>/<model>/). First device: Unitree Go2 (Air) — WebRTC LAN
#          signaling + data-channel control + video ingress. The `protocol`
#          feature is dependency-light (crypto/framing only) and compiles to
#          wasm32 so the Go2 WASM addon shares the same signaling logic; the
#          default `full` feature adds the native webrtc-rs session/channel.
# =============================================================================
[package]
name = "tentaflow-hardware"
version = "0.1.0"
edition = "2021"

[features]
default = ["full"]
# Pure Go2 signaling crypto/framing — no webrtc/tokio/std::net, wasm32-compatible.
protocol = []
# Native WebRTC session + channel + video ingress (pulls webrtc-rs + tokio).
full = ["protocol", "dep:tokio", "dep:webrtc", "dep:bytes"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true, default-features = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
aes-gcm = { workspace = true }
aes = { workspace = true }
ecb = { workspace = true, features = ["alloc"] }
rsa = { workspace = true }
md-5 = { workspace = true }
rand = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"], optional = true }
webrtc = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
memchr = { workspace = true }
