[package]
name = "tentaflow-client-native"
version = "0.1.0"
edition = "2024"

[lib]
name = "tentaflow_client_native"
crate-type = ["cdylib", "staticlib", "lib"]

# [[bin]]
# name = "test-client"
# path = "src/bin/test_client.rs"

[dependencies]
# Transport — iroh P2P + wspolny framework TentaFlow
tentaflow-protocol = { workspace = true }
tentaflow-transport = { workspace = true }
iroh = { workspace = true, features = ["portmapper", "tls-ring"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }

parking_lot = { workspace = true }

# Utils
anyhow = { workspace = true }
hex = { workspace = true, default-features = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "fast-rng"] }

[build-dependencies]
cbindgen = { workspace = true }
