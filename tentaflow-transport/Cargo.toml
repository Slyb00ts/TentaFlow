[package]
name = "tentaflow-transport"
version = "0.1.0"
edition = "2021"
description = "Wspolny transport iroh + CBOR uzywany przez tentaflow, tentaflow-client i sidecar"

[lib]
name = "tentaflow_transport"
path = "src/lib.rs"

[dependencies]
tentaflow-protocol = { workspace = true }

# Transport
iroh = { workspace = true, features = ["portmapper", "tls-ring"] }
iroh-mdns-address-lookup = { workspace = true }
iroh-mainline-address-lookup = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }

# Async runtime
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "io-util"] }
async-trait = { workspace = true }

# Utils
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true, default-features = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
criterion = { workspace = true, features = ["html_reports"] }
anyhow = { workspace = true }

[[bench]]
name = "noop"
harness = false
