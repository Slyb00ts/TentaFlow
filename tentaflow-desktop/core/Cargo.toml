[package]
name = "tentaflow-desktop-core"
version = "0.1.0"
edition = "2021"
description = "TentaFlow Desktop — natywna aplikacja z tray icon i GUI"

[lib]
name = "tentaflow_desktop_core"
path = "src/lib.rs"

[[bin]]
name = "tentaflow-desktop"
path = "src/main.rs"

[features]
# Wlacza inference-mlx (Swift bridge) w tentaflow-core. macOS desktop bin
# propaguje to przez swoj mlx-swift-bridge feature; iOS / inne platformy nie
# ruszaja.
mlx-swift-bridge = ["tentaflow-core/inference-mlx"]

[dependencies]
tentaflow-core = { workspace = true, features = ["docker", "inference-llamacpp", "vector-milvus"], default-features = true }
tentaflow-ui = { workspace = true }

tokio = { workspace = true, features = ["full"] }
eframe = { workspace = true, features = ["wgpu"], default-features = true }
egui = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tray-icon = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
ctrlc = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
rustls = { workspace = true, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
tentaflow-core = { workspace = true, features = ["docker", "inference-llamacpp", "inference-mlx"], default-features = true }
