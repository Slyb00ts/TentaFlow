# =============================================================================
# Plik: Cargo.toml
# Opis: Wspólny workspace, wersje zależności i profile budowania TentaFlow.
# =============================================================================

[workspace]
resolver = "2"
members = [
    "tentaflow",
    "tentaflow-bus",
    "tentaflow-cli",
    "tentaflow-client/native",
    "tentaflow-containers/agents/native/coding-agent-bridge",
    "tentaflow-containers/agents/native/teams-bot",
    "tentaflow-containers/sidecar",
    "tentaflow-core",
    "tentaflow-core/addon-sdk/sdk",
    "tentaflow-core/addon-sdk/template",
    "tentaflow-core/addons/company-lookup",
    "tentaflow-core/addons/contacts",
    "tentaflow-core/addons/deep-research",
    "tentaflow-core/addons/embeddings-chunker",
    "tentaflow-core/addons/eureka",
    "tentaflow-core/addons/go2",
    "tentaflow-core/addons/ibm-mcp",
    "tentaflow-core/addons/malicious-addon",
    "tentaflow-core/addons/mcp-core",
    "tentaflow-core/addons/mcp",
    "tentaflow-core/addons/notes",
    "tentaflow-core/addons/phone",
    "tentaflow-core/addons/rag",
    "tentaflow-core/addons/sdk-showcase",
    "tentaflow-core/addons/tentavision",
    "tentaflow-core/addons/outlook",
    "tentaflow-core/addons/sharepoint-rag",
    "tentaflow-core/addons/teams",
    "tentaflow-desktop/core",
    "tentaflow-desktop/linux",
    "tentaflow-desktop/macos",
    "tentaflow-desktop/windows",
    "tentaflow-hardware",
    "tentaflow-infer/crates/forge-cli",
    "tentaflow-infer/crates/forge-engine",
    "tentaflow-infer/crates/forge-formats",
    "tentaflow-infer/crates/forge-grammar",
    "tentaflow-infer/crates/forge-graph",
    "tentaflow-infer/crates/forge-hal",
    "tentaflow-infer/crates/forge-kernels",
    "tentaflow-infer/crates/forge-model",
    "tentaflow-infer/crates/forge-onnx",
    "tentaflow-infer/crates/forge-rdma",
    "tentaflow-infer/crates/forge-server",
    "tentaflow-infer/crates/forge-state",
    "tentaflow-infer/crates/forge-tokenize",
    "tentaflow-infer/crates/forge-types",
    "tentaflow-infer/crates/forge-whisper",
    "tentaflow-infer/scratch/modular_fp8_launch",
    "tentaflow-infer/xtask",
    "tentaflow-macros",
    "tentaflow-mobile/core",
    "tentaflow-protocol",
    "tentaflow-protocol-wasm",
    "tentaflow-protocol/fuzz",
    "tentaflow-quantum",
    "tentaflow-sdk-gen",
    "tentaflow-sdk-spec",
    "tentaflow-slam",
    "tentaflow-transport",
    "tentaflow-ui",
    "tentaflow-ui-schema",
    "tentaflow-voice",
    "tentaflow-voxel-wasm",
    "tentaflow-wrappers",
    "tentaflow-zvec",
    "tentaflow-zvec-sys",
    "tentanas-helper",
    "tools/burn-spike",
]
default-members = ["tentaflow"]
exclude = ["vendor", "thirdparty", "tentaflow-core/addons/crm", "tentaflow-core/addons/hello-dotnet", "tentaflow-core/addons/memory", "tentaflow-core/addons/translator"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

