[profile.dev]
debug = 1
incremental = true
codegen-units = 256
opt-level = 0

[profile.dev.package."sherpa-rs"]
opt-level = 3
[profile.dev.package."sherpa-rs-sys"]
opt-level = 3
[profile.dev.package."whisper-rs-sys"]
opt-level = 3
[profile.dev.package."llama-cpp-sys-2"]
opt-level = 3
[profile.dev.package."tract-onnx"]
opt-level = 3
[profile.dev.package."tract-core"]
opt-level = 3
[profile.dev.package."tract-linalg"]
opt-level = 3

# Optymalizacje kryptografii są potrzebne również w profilu deweloperskim.
[profile.dev.package."ring"]
opt-level = 3
[profile.dev.package."aes-gcm"]
opt-level = 3
[profile.dev.package."chacha20poly1305"]
opt-level = 3
[profile.dev.package."sha2"]
opt-level = 3
[profile.dev.package."argon2"]
opt-level = 3
[profile.dev.package."ed25519-dalek"]
opt-level = 3
[profile.dev.package."x25519-dalek"]
opt-level = 3
[profile.dev.package."curve25519-dalek"]
opt-level = 3

# Przetwarzanie obrazów pozostaje zoptymalizowane w profilu deweloperskim.
[profile.dev.package."image"]
opt-level = 3
[profile.dev.package."ndarray"]
opt-level = 3

# Dekompresja addonów i archiwum kontenerów.
[profile.dev.package."flate2"]
opt-level = 3
[profile.dev.package."zstd"]
opt-level = 3
[profile.dev.package."zstd-safe"]
opt-level = 3
[profile.dev.package."zstd-sys"]
opt-level = 3

# Testy zachowują optymalizacje zależności obliczeniowych.

[profile.test]
debug = 1

[profile.test.package."sherpa-rs"]
opt-level = 3
[profile.test.package."whisper-rs-sys"]
opt-level = 3
[profile.test.package."llama-cpp-sys-2"]
opt-level = 3
[profile.test.package."ring"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = "off"
codegen-units = 4
incremental = true
strip = false

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = 1
strip = false

[patch.crates-io.llama-cpp-sys-2]
path = "vendor/crates/llama-cpp-sys-2"

[patch.crates-io.sherpa-rs-sys]
path = "vendor/crates/sherpa-rs-sys"

[patch.crates-io.whisper-rs-sys]
path = "vendor/crates/whisper-rs-sys"

[patch.crates-io.pdfium-render]
path = "vendor/crates/pdfium-render"
