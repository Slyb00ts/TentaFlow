# Manifest serwisu NVIDIA Llama-Nemotron Embed — modele embeddingow tekstu
# serwowane przez vLLM w trybie --task embed. Docker (sidecar QUIC) oraz natywny
# python-bundle (CUDA/ROCm). Wariant Apple Silicon ma osobny silnik
# `nemotron-embed-mlx` (embedded MLX) w nemotron-embed-mlx.toml.

[engine]
id = "nemotron-embed"
backend = "vllm"  # served by vLLM — drives gpu_memory_utilization + VRAM calculator
provider = "tentaflow"
category = "embeddings"
name = "NVIDIA Llama-Nemotron Embed"
description_pl = "Modele embeddingów tekstu NVIDIA Llama-Nemotron serwowane przez vLLM (--task embed). Wybierz wariant w kreatorze."
description_en = "NVIDIA Llama-Nemotron text embedding models served via vLLM (--task embed). Pick a variant in the wizard."
homepage = "https://huggingface.co/nvidia"
license = "nvidia-open-model-license"
icon = "vllm"
default_port = 8000
api = "openai-compatible"
version = "v2"
dgx_spark = false
service_surfaces = ["embeddings"]
input_modalities = ["text"]
output_modalities = ["embedding"]

[deploy.docker]
context_path = "embeddings/docker/nemotron-embed"
platforms = ["linux", "windows"]
transport = "direct-http"

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "embeddings/python/nemotron-embed"

[[model_preset]]
id = "llama-nemotron-embed-1b-v2"
display_name = "Llama-Nemotron Embed 1B v2"
repo = "nvidia/llama-nemotron-embed-1b-v2"
recommended = true
