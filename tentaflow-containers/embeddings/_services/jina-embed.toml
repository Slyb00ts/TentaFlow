# Manifest serwisu Jina Embeddings v5 (tekst) — modele embeddingow oparte na
# Qwen3-0.6B (1024d, Matryoshka, last-token pooling) serwowane przez vLLM
# (--task embed). Docker (direct-http) oraz natywny python-bundle (CUDA/ROCm).
# Apple Silicon: osobny silnik `jina-embed-mlx`; lekki CPU/AMD/telefon:
# `jina-embed-gguf`. Repo per-task maja wmergowany adapter (retrieval/
# text-matching) zgodny z vLLM/TEI. Licencja CC-BY-NC-4.0 (niekomercyjna).

[engine]
id = "jina-embed"
backend = "vllm"  # served by vLLM — drives gpu_memory_utilization + VRAM calculator
provider = "tentaflow"
category = "embeddings"
name = "Jina Embeddings v5 (Text)"
description_pl = "Embeddingi tekstu Jina v5 (Qwen3-0.6B, 1024d, last-token) przez vLLM (--task embed). CUDA/ROCm. Apple: jina-embed-mlx, lekki CPU/telefon: jina-embed-gguf."
description_en = "Jina v5 text embeddings (Qwen3-0.6B, 1024d, last-token) via vLLM (--task embed). CUDA/ROCm. Apple: jina-embed-mlx, light CPU/phone: jina-embed-gguf."
homepage = "https://huggingface.co/jinaai"
license = "cc-by-nc-4.0"
icon = "vllm"
default_port = 8000
api = "openai-compatible"
version = "v5"
dgx_spark = false
service_surfaces = ["embeddings"]
input_modalities = ["text"]
output_modalities = ["embedding"]

[deploy.docker]
context_path = "embeddings/docker/jina-embed"
platforms = ["linux", "windows"]
transport = "direct-http"

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "embeddings/python/jina-embed"

[[model_preset]]
id = "jina-v5-text-small-retrieval"
display_name = "Jina v5 Text Small — Retrieval (677M)"
repo = "jinaai/jina-embeddings-v5-text-small-retrieval"
recommended = true

[[model_preset]]
id = "jina-v5-text-nano-retrieval"
display_name = "Jina v5 Text Nano — Retrieval (239M)"
repo = "jinaai/jina-embeddings-v5-text-nano-retrieval"

[[model_preset]]
id = "jina-v5-text-small-text-matching"
display_name = "Jina v5 Text Small — Text Matching (677M)"
repo = "jinaai/jina-embeddings-v5-text-small-text-matching"
