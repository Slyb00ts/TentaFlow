# Manifest serwisu NVIDIA Llama-Nemotron Embed VL — multimodalne embeddingi
# (tekst + obraz) serwowane przez vLLM w trybie --task embed. Docker
# (sidecar QUIC) oraz natywny python-bundle (CUDA/ROCm).

[engine]
id = "nemotron-embed-vl"
provider = "tentaflow"
category = "embeddings"
name = "NVIDIA Llama-Nemotron Embed VL"
description_pl = "Multimodalne embeddingi (tekst i obraz) NVIDIA Llama-Nemotron serwowane przez vLLM (--task embed). Wybierz wariant w kreatorze."
description_en = "NVIDIA Llama-Nemotron multimodal embeddings (text and image) served via vLLM (--task embed). Pick a variant in the wizard."
homepage = "https://huggingface.co/nvidia"
license = "nvidia-open-model-license"
icon = "vllm"
default_port = 8000
api = "openai-compatible"
version = "v2"
dgx_spark = false
service_surfaces = ["embeddings"]
input_modalities = ["text", "image"]
output_modalities = ["embedding"]

[deploy.docker]
context_path = "embeddings/docker/nemotron-embed-vl"
platforms = ["linux", "windows"]
transport = "direct-http"

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "embeddings/python/nemotron-embed-vl"

[[model_preset]]
id = "llama-nemotron-embed-vl-1b-v2"
display_name = "Llama-Nemotron Embed VL 1B v2"
repo = "nvidia/llama-nemotron-embed-vl-1b-v2"
recommended = true
