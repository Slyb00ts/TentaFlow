# =============================================================================
# Plik: embeddings/python/jina-embed/bundle.toml
# Opis: Jina Embeddings v5 jako natywny python-bundle — vLLM (PyPI pinned
#       0.25.1) serwowany w trybie embeddings (--task embed). CUDA (cu130) oraz
#       ROCm (rocm7.0). Eksponuje OpenAI-compatible /v1/embeddings.
# =============================================================================

[bundle]
engine = "jina-embed"
description = "Jina Embeddings v5 (text) via vLLM (PyPI, pinned 0.25.1, --task embed)"
python_version = "3.12"
# Pinned na 0.25.1 dla reproducibility — git main moze rozjechac sie z deps.
source = "pypi"
pypi_package = "vllm==0.25.1"

[launch]
command = "python"
# Bundle dostarcza identity flags (model + transport) i baseline defaults.
# `--task embed` przelacza vLLM na sciezke embeddingow (/v1/embeddings) zamiast
# generacji. --trust-remote-code bo repo Jina dostarcza wlasny kod architektury.
# `--gpu-memory-utilization` celowo NIE jest tu — backend (`python_bundle.rs`)
# zarzadza ta flaga (auto-clamp wzgledem free VRAM / user explicit z wizarda).
args = [
    "-m", "vllm.entrypoints.openai.api_server",
    "--host", "127.0.0.1",
    "--port", "${PORT:-8000}",
    "--model", "${MODEL}",
    "--task", "embed",
    "--trust-remote-code",
    # Serwuj pod slugiem ktory core routuje (preset id), nie pod sciezka repo.
    "--served-model-name", "${SERVED_MODEL_NAME}",
    "--dtype", "auto",
    "--max-model-len", "${MAX_MODEL_LEN:-8192}",
]
internal_port = 8000

[requires]
# Modele Jina v5 to 0.6B (nano 0.24B) — duzo mniejsze niz Nemotron 1B.
gpu_memory_gb = 2
disk_gb = 6
platforms = ["linux-x86_64", "linux-aarch64", "windows-x86_64"]

# vLLM wymaga jawnego wheela +cu130 dla B300 (sm_103) — domyslny PyPI to cu129
# i nie ma optymalizacji Blackwell. extra_index wskazuje nightly cu130 vLLM;
# torch tez idzie z cu130 (Dockerfile pobiera go z download.pytorch.org/whl/cu130).
[[install_variants]]
backend = "cuda"
extra_index = "https://wheels.vllm.ai/nightly/cu130"
extras = []

[[install_variants]]
backend = "rocm"
extra_index = "https://download.pytorch.org/whl/rocm7.0"
extras = []
install_hint = "VLLM_TARGET_DEVICE=rocm"
