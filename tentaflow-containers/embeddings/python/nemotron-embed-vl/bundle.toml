# =============================================================================
# Plik: embeddings/python/nemotron-embed-vl/bundle.toml
# Opis: NVIDIA Llama-Nemotron Embed VL jako natywny python-bundle — vLLM (PyPI
#       pinned 0.34.0) serwowany w trybie embeddings multimodalnych
#       (--runner pooling). Model liczy embeddingi z tekstu i obrazow. CUDA (cu130)
#       oraz ROCm (rocm7.0). Eksponuje OpenAI-compatible /v1/embeddings.
# =============================================================================

[bundle]
engine = "nemotron-embed-vl"
description = "NVIDIA Llama-Nemotron Embed VL (multimodal) via vLLM (PyPI, pinned 0.34.0, --runner pooling)"
python_version = "3.12"
# Pinned na 0.34.0 dla reproducibility — git main moze rozjechac sie z deps.
source = "pypi"
pypi_package = "vllm==0.34.0"

[launch]
command = "python"
# Bundle dostarcza identity flags (model + transport) i baseline defaults.
# `--runner pooling` przelacza vLLM na sciezke embeddingow. `--trust-remote-code`
# laduje wlasny procesor multimodalny modelu, a `--limit-mm-per-prompt` wlacza
# sciezke obrazow. `--gpu-memory-utilization` celowo NIE jest tu — backend
# (`python_bundle.rs::prepare`) zarzadza ta flaga.
args = [
    "-m", "vllm.entrypoints.openai.api_server",
    "--host", "127.0.0.1",
    "--port", "${PORT:-8000}",
    "--model", "${MODEL}",
    "--runner", "pooling",
    "--trust-remote-code",
    "--limit-mm-per-prompt", "{\"image\": ${MM_IMAGE_LIMIT:-1}}",
    # Serwuj pod slugiem ktory core routuje (preset id), nie pod sciezka repo.
    "--served-model-name", "${SERVED_MODEL_NAME}",
    "--dtype", "auto",
    "--max-model-len", "${MAX_MODEL_LEN:-8192}",
]
internal_port = 8000

[requires]
gpu_memory_gb = 6
disk_gb = 16
platforms = ["linux-x86_64", "linux-aarch64", "windows-x86_64"]

# vLLM comes from its RELEASE index for the pinned version, which serves the
# CUDA 13.0 build B300 (sm_103) needs. Not the nightly index: it holds only dev
# builds (0.34.0rc1.devN), so a release pin would silently resolve from PyPI.
# The URL embeds the version: bump it with `pypi_package`.
# torch resolves from PyPI, whose torch 2.14.0 is itself a CUDA 13.0 build.
[[install_variants]]
backend = "cuda"
extra_index = "https://wheels.vllm.ai/0.34.0/cu130"
extras = []

[[install_variants]]
backend = "rocm"
extra_index = "https://wheels.vllm.ai/rocm/"
extras = []
install_hint = "VLLM_TARGET_DEVICE=rocm"
