[engine]
id = "anthropic"
category = "llm"
resource_kind = "ai"
provider = "external"
name = "Anthropic"
description_pl = "Chmurowe API Anthropic (modele Claude) przez natywny protokół Messages."
description_en = "Anthropic cloud API (Claude models) over the native Messages protocol."
homepage = "https://www.anthropic.com"
license = "Proprietary"
default_port = 443
api = "anthropic"
version = "1.0.0"

[deploy.external]
platforms = ["linux", "macos", "windows"]
detection_endpoint = "https://api.anthropic.com/v1"
detection_health_path = "/models"
requires_api_key = true

[[model_preset]]
id = "claude-opus-4-8"
display_name = "Claude Opus 4.8"
repo = "claude-opus-4-8"
recommended = true

[[model_preset]]
id = "claude-sonnet-4-6"
display_name = "Claude Sonnet 4.6"
repo = "claude-sonnet-4-6"

[[model_preset]]
id = "claude-haiku-4-5"
display_name = "Claude Haiku 4.5"
repo = "claude-haiku-4-5"
