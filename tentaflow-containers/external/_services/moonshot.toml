[engine]
id = "moonshot"
category = "llm"
resource_kind = "ai"
provider = "external"
name = "Moonshot AI (Kimi)"
description_pl = "Chmurowe API Moonshot AI (modele Kimi) zgodne z protokołem OpenAI."
description_en = "Moonshot AI cloud API (Kimi models) over the OpenAI-compatible protocol."
homepage = "https://platform.moonshot.ai"
license = "Proprietary"
default_port = 443
api = "openai-compatible"
version = "1.0.0"

[deploy.external]
platforms = ["linux", "macos", "windows"]
detection_endpoint = "https://api.moonshot.ai/v1"
detection_health_path = "/models"
requires_api_key = true

[[model_preset]]
id = "kimi-k2-0711-preview"
display_name = "Kimi K2"
repo = "kimi-k2-0711-preview"
recommended = true

[[model_preset]]
id = "moonshot-v1-128k"
display_name = "Moonshot v1 128K"
repo = "moonshot-v1-128k"
