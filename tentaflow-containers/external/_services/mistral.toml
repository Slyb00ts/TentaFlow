[engine]
id = "mistral"
category = "llm"
resource_kind = "ai"
provider = "external"
name = "Mistral AI"
description_pl = "Chmurowe API Mistral AI z modelami Large i Small."
description_en = "Mistral AI cloud API with Large and Small models."
homepage = "https://mistral.ai"
license = "Proprietary"
default_port = 443
api = "openai-compatible"
version = "1.0.0"

[deploy.external]
platforms = ["linux", "macos", "windows"]
detection_endpoint = "https://api.mistral.ai/v1"
detection_health_path = "/models"
requires_api_key = true

[[model_preset]]
id = "mistral-large-latest"
display_name = "Mistral Large"
repo = "mistral-large-latest"
recommended = true

[[model_preset]]
id = "mistral-small-latest"
display_name = "Mistral Small"
repo = "mistral-small-latest"
