[engine]
id = "deepseek"
category = "llm"
resource_kind = "ai"
provider = "external"
name = "DeepSeek"
description_pl = "Chmurowe API DeepSeek z modelami chat i reasoning zgodne z OpenAI."
description_en = "DeepSeek cloud API with chat and reasoning models, OpenAI-compatible."
homepage = "https://deepseek.com"
license = "Proprietary"
default_port = 443
api = "openai-compatible"
version = "1.0.0"

[deploy.external]
platforms = ["linux", "macos", "windows"]
detection_endpoint = "https://api.deepseek.com/v1"
detection_health_path = "/models"
requires_api_key = true

[[model_preset]]
id = "deepseek-chat"
display_name = "DeepSeek Chat"
repo = "deepseek-chat"
recommended = true

[[model_preset]]
id = "deepseek-reasoner"
display_name = "DeepSeek Reasoner"
repo = "deepseek-reasoner"
