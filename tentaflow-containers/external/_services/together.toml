[engine]
id = "together"
category = "llm"
resource_kind = "ai"
provider = "external"
name = "Together AI"
description_pl = "Chmurowy hosting modeli open-source Together AI przez API zgodne z OpenAI."
description_en = "Together AI cloud hosting of open-source models via OpenAI-compatible API."
homepage = "https://together.ai"
license = "Proprietary"
default_port = 443
api = "openai-compatible"
version = "1.0.0"

[deploy.external]
platforms = ["linux", "macos", "windows"]
detection_endpoint = "https://api.together.xyz/v1"
detection_health_path = "/models"
requires_api_key = true

[[model_preset]]
id = "llama-3-3-70b-instruct-turbo"
display_name = "Llama 3.3 70B Instruct Turbo"
repo = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
recommended = true
