[engine]
id = "openai"
category = "llm"
resource_kind = "ai"
provider = "external"
name = "OpenAI"
description_pl = "Chmurowe API OpenAI (modele GPT) zgodne z protokołem OpenAI."
description_en = "OpenAI cloud API (GPT models) over the OpenAI-compatible protocol."
homepage = "https://platform.openai.com"
license = "Proprietary"
default_port = 443
api = "openai-compatible"
version = "1.0.0"

[deploy.external]
platforms = ["linux", "macos", "windows"]
detection_endpoint = "https://api.openai.com/v1"
detection_health_path = "/models"
requires_api_key = true

[[model_preset]]
id = "gpt-5-5"
display_name = "GPT-5.5"
repo = "gpt-5.5"
recommended = true

[[model_preset]]
id = "gpt-5-1"
display_name = "GPT-5.1"
repo = "gpt-5.1"
