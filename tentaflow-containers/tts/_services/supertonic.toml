id = "supertonic-3-m5"
display_name = "Supertonic v3 (M5, meski)"
repo = "Supertone/supertonic-3"

[[model_preset]]
id = "supertonic-3-f1"
display_name = "Supertonic v3 (F1, zenski)"
repo = "Supertone/supertonic-3"

[[model_preset]]
id = "supertonic-3-f2"
display_name = "Supertonic v3 (F2, zenski)"
