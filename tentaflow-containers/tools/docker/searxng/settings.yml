# =============================================================================
# Plik: settings.yml
# Opis: Minimalna konfiguracja SearXNG pod lokalny backend wyszukiwania TentaFlow.
# Przykład: SEARXNG_SECRET=$(openssl rand -hex 32) docker run -p 8080:8080 obraz
# =============================================================================

use_default_settings: true

general:
  debug: false
  instance_name: "TentaFlow SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false

# Upstream domyslnie opiera kategorie "general" o brave/startpage/duckduckgo.
# Z jednego hosta te trzy szybko lapia CAPTCHA albo "too many requests" i
# instancja zwraca zero wynikow, mimo ze sama stoi. Wlaczamy dodatkowe,
# niezalezne zrodla, zeby wyszukiwanie nie wisialo na jednym silniku.
engines:
  - name: bing
    disabled: false
  - name: wikipedia
    disabled: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  useragent_suffix: "TentaFlow"
