[engine]
id = "browser-renderer"
category = "tools"
name = "Browser Renderer"
description_pl = "Headless browser do renderowania stron JS-heavy dla web research."
description_en = "Headless browser renderer for JS-heavy web research pages."
homepage = "https://playwright.dev/python/"
license = "Apache-2.0"
resource_kind = "infra"
default_port = 8092
api = "custom"
version = "1.60.0"
requires_model = false
gpu_supported = false

[deploy.docker]
context_path = "tools/docker/browser-renderer"
platforms = ["linux", "windows"]
transport = "direct-http"
gpus = "none"
download_size_mb = 1600

[deploy.native]
platforms = ["linux", "macos", "windows"]
runtime = "python-bundle"
bundle_path = "tools/python/browser-renderer"

[[parameter]]
key = "max_contexts"
label_pl = "Maksymalna liczba profili"
label_en = "Max browser profiles"
kind = "int"
default = 8
range = { min = 1.0, max = 64.0, step = 1.0 }
bindings = [
  { when = "docker", type = "env", name = "BROWSER_RENDERER_MAX_CONTEXTS" },
  { when = "native_python_bundle", type = "env", name = "BROWSER_RENDERER_MAX_CONTEXTS" }
]

[[parameter]]
key = "context_ttl_seconds"
label_pl = "TTL nieaktywnych profili"
label_en = "Idle profile TTL"
kind = "int"
default = 900
range = { min = 60.0, max = 86400.0, step = 60.0 }
bindings = [
  { when = "docker", type = "env", name = "BROWSER_RENDERER_CONTEXT_TTL_SECONDS" },
  { when = "native_python_bundle", type = "env", name = "BROWSER_RENDERER_CONTEXT_TTL_SECONDS" }
]
