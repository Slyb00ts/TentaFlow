[package]
name = "tentaflow-sidecar"
version = "0.1.0"
edition = "2021"
description = "Generyczny sidecar iroh dla kontenerow TentaFlow (llm/stt/tts/embeddings/reranker). Rola wybierana z config.toml, kontener AI nic nie wie o transporcie."

[lib]
name = "tentaflow_sidecar"
path = "src/lib.rs"

[[bin]]
name = "tentaflow-sidecar"
path = "src/main.rs"

[dependencies]
tentaflow-protocol = { workspace = true }
tentaflow-transport = { workspace = true }
iroh = { workspace = true, features = ["portmapper", "tls-ring"] }

tokio = { workspace = true, features = ["full"] }

reqwest = { workspace = true, features = ["rustls", "json", "stream", "multipart"] }
futures-util = { workspace = true }

toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-trait = { workspace = true }
hex = { workspace = true, default-features = true }

[dev-dependencies]
tentaflow-transport = { workspace = true }
