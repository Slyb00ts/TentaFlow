# Pinowane wheels dla bundla vLLM.
# Regenerujemy komenda:
#   uv pip compile --python 3.11 --output-file requirements.lock pyproject.toml
# (albo rownoznacznie: `uv pip install vllm; uv pip freeze`)
#
# Dla source = "git" ten plik jest fallbackiem — faktyczne rozwiazanie deps
# odbywa sie przez `pip install -e .` z klona repo. Ta lock sluzy do
# wstepnej instalacji Ray i narzedzi buildu przed glownym pakietem.

# torch is NOT pinned here: this file is shared by every install variant, and
# the variants need different torch builds. The cuda variant pins the cu130
# triple vLLM requires in its `extras`; the vLLM ROCm wheel requires the torch
# build of its own index (2.13.0+rocm10.0.0 for vllm-0.34.0+rocm100), which a
# shared 2.14.0 pin would first replace with a CUDA wheel from PyPI.

# Ray — wymagany do multi-node tensor-parallel (head+worker,
# --distributed-executor-backend ray). 2.60.0 ma kola aarch64 + x86_64,
# kompatybilny z vLLM 0.34.0 / torch 2.14. Native host ma juz systemowy
# rdma-core, wiec w bundlu wystarczy sam Ray (NCCL uzyje systemowego
# libibverbs do RoCE).
ray==2.60.0

# vLLM deps (pobierane z https://github.com/vllm-project/vllm/blob/main/requirements-cuda.txt)
# Sidecar python_venv pobiera je wprost z requirements-cuda.txt HEAD;
# ten plik tylko aktualizuje kilka najciezszych wheels do wstepnego cache.

# Runtime tooling - bez pinow, vLLM 0.34.0 sam zaciagnie kompatybilne fastapi/uvicorn.
# vLLM wymaga model-hosting-container-standards >= 0.1.13, ktore zalezy
# od starlette >= 0.49 - to koliduje z fastapi == 0.115.5 ktore pinuje
# starlette < 0.42.

# JIT compile tooling dla FlashInfer custom kernels:
# - NVFP4 quantized models (LilaRest/gemma-4-31B-it-NVFP4-turbo itp.)
#   wymagaja flashinfer_mm_fp4 kernela compilowanego on-demand przez
#   FlashInfer JIT (cutlass GEMM SM120). Brak ninja -> FileNotFoundError
#   przy pierwszym profile_run, deploy crash.
# - cmake potrzebny przez setuptools-rust niektorych deps (apache-tvm-ffi).
ninja
cmake
