# =============================================================================
# Plik: python-bundles/vllm-spark/bundle.toml
# Opis: vLLM 0.27.0 budowane ze zrodel (`pip install -e .`) pod NVIDIA
#       DGX Spark (GB10 Grace Blackwell, aarch64, sm_121a). PyPI wheels
#       targetuja sm_120 max — sm_121 sypie sie w FP8/Mamba/NVFP4 kernelach,
#       wiec jedyna sciezka do dzialajacego na Sparku builda ze zrodel to
#       lokalny build z TORCH_CUDA_ARCH_LIST=12.1a. Pierwszy install trwa
#       20-30 min (kompilacja CUDA kerneli) — w UI jest informacja o tym.
# =============================================================================

[bundle]
engine = "vllm-spark"
description = "vLLM 0.27.0 built from source for DGX Spark (GB10, sm_121a)"
python_version = "3.12"
# `git` source — clone tagu v0.27.0 i lokalny `pip install -e .`. Ten flow
# odpala build CUDA kerneli pod TORCH_CUDA_ARCH_LIST z install_variants.env.
source = "git"
git_repo = "https://github.com/vllm-project/vllm"
git_ref = "v0.27.0"

[launch]
command = "python"
args = [
    "-m", "vllm.entrypoints.openai.api_server",
    "--host", "127.0.0.1",
    "--port", "${PORT:-8000}",
    "--model", "${MODEL}",
    # Serve under the slug the core routes by (`models_from_manifest` model_name
    # = preset id), not the repo path `${MODEL}`. Without this vllm advertises
    # the model as its HF repo and every dispatch 404s when preset id != repo.
    "--served-model-name", "${SERVED_MODEL_NAME}",
    "--dtype", "auto",
    "--max-model-len", "${MAX_MODEL_LEN:-8192}",
    "--max-num-batched-tokens", "${MAX_NUM_BATCHED_TOKENS:-8192}",
    # Performance baseline — wspolne dla wszystkich vllm (patrz
    # vllm/bundle.toml).
    "--enable-prefix-caching",
    "--enable-chunked-prefill",
    # GB10/SM121 nie powinien startowac z FlashInfer autotune: autotuner
    # testuje taktyki dla datacenter Blackwell i potrafi zuzyc dodatkowy VRAM
    # albo opoznic gotowosc o kilkanascie minut.
    "--no-enable-flashinfer-autotune",
    # NOTE: vllm 0.27.0 NIE ma juz `--swap-space` (flaga zostala wyrzucona).
    # Spark unified memory i tak nie potrzebuje CPU swap — default behaviour
    # OK. Dla offloadu (gdyby kiedys byl potrzebny) sa nowe: `--cpu-offload-gb`,
    # `--kv-offloading-size`, `--kv-offloading-backend`.
]
internal_port = 8000

[launch.env]
# Runtime env — wymuszone niezaleznie od wizarda. Patrz researche w
# eelbaz/dgx-spark-vllm-setup i eugr/spark-vllm-docker dla detali sm_121a.
TORCH_CUDA_ARCH_LIST = "12.1a"
VLLM_USE_FLASHINFER_MXFP4_MOE = "1"
VLLM_SKIP_P2P_CHECK = "1"
TRITON_PTXAS_PATH = "/usr/local/cuda/bin/ptxas"

[requires]
gpu_memory_gb = 8
disk_gb = 30
# Spark = aarch64 only. Wykluczamy x86 i Windows zeby manifest nie
# probowal sie instalowac w nieobslugiwanym srodowisku.
platforms = ["linux-aarch64"]

# Wariant `cuda-spark` jest wybierany przez `python_venv::install_variant_tag`
# kiedy `system_check.gpu.is_dgx_spark == true`. Fallback na `cuda` istnieje
# w pick_install_variant — nie korzystamy z niego tu (zaden inny variant nie
# zadziala bez build-time TORCH_CUDA_ARCH_LIST).
[[install_variants]]
backend = "cuda-spark"
# Stabilny indeks cu130 ma juz torch-2.13.0+cu130 dla aarch64 (cp310-cp314),
# wiec nightly nie jest potrzebny — a nightly zmienia sie pod reka i potrafi
# rozjechac ABI z kompilowanymi kernelami vllm.
extra_index = "https://download.pytorch.org/whl/cu130"
extras = []

# Env wstrzykiwane WYLACZNIE do procesow `pip install` (a wiec rowniez do
# source builda vllm 0.27.0). Bez tego nvcc kompiluje kernele do sm_120
# i runtime crashuje na sm_121 z `cudaErrorLaunchFailure` / illegal instruction.
[install_variants.env]
# MUSI byc `12.0`, mimo ze GB10 raportuje sm_121. Pod CUDA >= 13 vllm celowo
# usuwa 12.1 z CUDA_SUPPORTED_ARCHS i uzywa celow RODZINOWYCH NVIDII (12.0f
# obejmuje cala rodzine 12.x), wiec wpis `12.1` albo `12.1a` jest odfiltrowany
# i build po cichu schodzi do domyslnej listy architektur torcha.
# Zweryfikowane wykonawczo: kernel zbudowany tak uruchamia sie na sm_121
# (scripts/build-vllm-spark-venv.sh odpala prawdziwy kernel na GPU — etykieta
# `sm_120` w cuobjdump nie odroznia celu rodzinowego 12.0f od arch-specific
# 12.0a, a tylko ten pierwszy dziala na 12.1).
TORCH_CUDA_ARCH_LIST = "12.0"
VLLM_TARGET_DEVICE = "cuda"
# Build kerneli z lokalnych zrodel — bez tego pip moglby probowac
# sciagnac prebuilt wheel z PyPI.
VLLM_USE_PRECOMPILED = "0"
# Triton 3.7+ jest potrzebny dla sm_121 PTX — vllm 0.27.0 ciaga konkretna
# wersje przez requirements, ale upewniamy sie ze build nie cache'uje
# starszej z systemowego cache.
TRITON_PTXAS_PATH = "/usr/local/cuda/bin/ptxas"
