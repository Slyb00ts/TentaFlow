# Manifest serwisu Qwen3-VL MLX — zamiennik VLM dla Apple Silicon (macOS).
# Model wizualno-jezykowy (tekst + obraz na wejsciu, tekst na wyjsciu) serwowany
# przez mlx-vlm (wbudowany serwer OpenAI-compatible). Tylko natywny
# python-bundle (bez Docker — Apple native). Sciezka NVIDIA/CUDA uzywa
# oryginalnych Nemotron VLM (vllm.toml), GPU AMD/CPU uzywa silnika `qwen3-vl`.

[engine]
id = "qwen3-vl-mlx"
category = "llm"
name = "Qwen3-VL (MLX)"
description_pl = "Model wizualno-jezykowy Qwen3-VL (tekst i obraz) na Apple Silicon przez mlx-vlm. Wybierz wariant w kreatorze."
description_en = "Qwen3-VL vision-language model (text and image) on Apple Silicon via mlx-vlm. Pick a variant in the wizard."
homepage = "https://github.com/Blaizzy/mlx-vlm"
license = "apache-2.0"
icon = "mlx"
default_port = 8000
api = "openai-compatible"
version = "v3"
service_surfaces = ["chat"]
input_modalities = ["text", "image"]
output_modalities = ["text"]

[deploy.native]
platforms = ["macos"]
runtime = "python-bundle"
bundle_path = "llm/python/qwen3-vl-mlx"

[[model_preset]]
id = "qwen3-vl-30b-a3b-instruct-mlx-4bit"
display_name = "Qwen3-VL 30B A3B Instruct (MLX 4-bit)"
repo = "mlx-community/Qwen3-VL-30B-A3B-Instruct-4bit"
quantization = "int4"
recommended = true

[[model_preset]]
id = "qwen3-vl-4b-instruct-mlx-4bit"
display_name = "Qwen3-VL 4B Instruct (MLX 4-bit)"
repo = "mlx-community/Qwen3-VL-4B-Instruct-4bit"
quantization = "int4"
