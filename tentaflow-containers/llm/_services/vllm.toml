# Manifest serwisu vLLM — serwer LLM z PagedAttention. Native bundle (python),
# CUDA (Linux/Windows) i ROCm (Linux). Dla macOS Apple Silicon uzywamy
# osobnego silnika `vllm-metal` (plugin MLX) w vllm-metal.toml, bo upstream
# vLLM nie obsluguje Metal/MLX out-of-the-box.

[engine]
id = "vllm"
category = "llm"
name = "vLLM"
description_pl = "Serwer LLM z PagedAttention i continuous batching. CUDA (Linux/Windows) albo ROCm (Linux)."
description_en = "LLM server with PagedAttention and continuous batching. CUDA (Linux/Windows) or ROCm (Linux)."
homepage = "https://github.com/vllm-project/vllm"
license = "Apache-2.0"
icon = "vllm"
default_port = 8000
api = "openai-compatible"
version = "0.23.0"
# PyPI vllm 0.23.0 wheels target sm_120 max — na DGX Spark (GB10, sm_121)
# crashuja w FP8 / Mamba / NVFP4 kernelach. Spark dostaje osobny silnik
# `vllm-spark` ktory buduje vllm 0.23.0 ze zrodel z TORCH_CUDA_ARCH_LIST=12.1a.
dgx_spark = false

[deploy.docker]
context_path = "llm/docker/vllm"
platforms = ["linux", "windows"]
transport = "sidecar-quic"

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "llm/python/vllm"

[[model_preset]]
id = "qwen3-5-0-8b"
display_name = "Qwen 3.5 0.8B"
repo = "Qwen/Qwen3.5-0.8B"
recommended = true

[[model_preset]]
id = "llama-3-1-8b-instruct"
display_name = "Llama 3.1 8B Instruct"
repo = "meta-llama/Meta-Llama-3.1-8B-Instruct"

# Bielik PL Minitron 7B NVFP4 + draft 1.5B — gotowy, prekonfigurowany bloczek
# (TentaFlow). `featured` = wlasny kafelek w katalogu; speculative (draft_model)
# wlacza sie automatycznie dla featured blokow, wiec deploy jest turnkey
# (vLLM + NVFP4 + draft, bez konfiguracji w kreatorze). NVFP4 dziala na kazdej
# karcie NVIDIA — HW-accelerated na Blackwell, software-dequant na starszych.
[[model_preset]]
id = "bielik-pl-minitron-7b-nvfp4"
display_name = "Bielik PL Minitron 7B (NVFP4 + draft 1.5B)"
repo = "TentaFlow/Bielik-PL-Minitron-7B-NVFP4"
quantization = "nvfp4"
speculator_repo = "TentaFlow/Bielik-1.5B-NVFP4"
speculator_method = "draft_model"
speculator_num_tokens = 3
featured = true

[[model_preset]]
id = "nemotron-3-super-120b-a12b"
display_name = "Nemotron 3 Super 120B A12B"
repo = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8"
quantization = "fp8"

[[model_preset]]
id = "nemotron-3-nano-omni-30b-a3b-reasoning"
display_name = "Nemotron 3 Nano Omni 30B A3B (VLM reasoning)"
repo = "nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-FP8"
quantization = "fp8"

[[model_preset]]
id = "nemotron-nano-12b-v2-vl"
display_name = "Nemotron Nano 12B v2 VL (captioning)"
repo = "nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-FP8"
quantization = "fp8"
