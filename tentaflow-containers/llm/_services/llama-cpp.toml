LLAMA_BUILD_PACKAGES = "libvulkan-dev glslc"
LLAMA_RUNTIME_PACKAGES = "libvulkan1 mesa-vulkan-drivers"

[[parameter]]
key = "ctx_size"
label_pl = "Okno kontekstu na slot (0 = pelny kontekst modelu)"
label_en = "Context window per slot (0 = the model's full context)"
kind = "int"
default = 0
range = { min = 0.0, max = 1048576.0, step = 512.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "ctx_size" } ]

[[parameter]]
key = "n_parallel"
label_pl = "Rownolegle sloty"
label_en = "Parallel slots"
kind = "int"
default = 1
range = { min = 1.0, max = 64.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "n_parallel" } ]

[[parameter]]
key = "n_gpu_layers"
label_pl = "Warstwy na GPU"
label_en = "GPU layers"
kind = "int"
default = 99
range = { min = 0.0, max = 999.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "n_gpu_layers" } ]

[[parameter]]
key = "batch_size"
label_pl = "Batch prefill"
label_en = "Prefill batch"
kind = "int"
default = 512
range = { min = 32.0, max = 8192.0, step = 32.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "batch_size" } ]

[[parameter]]
key = "threads"
label_pl = "Watki CPU (0 = auto)"
label_en = "CPU threads (0 = auto)"
kind = "int"
default = 0
range = { min = 0.0, max = 256.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "threads" } ]

[[parameter]]
key = "speculative_method"
label_pl = "Speculative decoding"
label_en = "Speculative decoding"
kind = "enum"
options = ["off", "mtp", "ngram-simple"]
default = "off"
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "speculative_method" } ]

[[parameter]]
key = "flash_attn"
label_pl = "Flash Attention"
label_en = "Flash Attention"
kind = "enum"
options = ["auto", "off", "on"]
default = "auto"
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "flash_attn" } ]

[[parameter]]
key = "num_speculative_tokens"
label_pl = "Tokeny MTP"
label_en = "MTP tokens"
kind = "int"
default = 4
range = { min = 1.0, max = 16.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "num_speculative_tokens" } ]

[[parameter]]
key = "size_ngram"
label_pl = "Ngram lookback"
label_en = "Ngram lookback"
kind = "int"
default = 3
range = { min = 1.0, max = 16.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "size_ngram" } ]

[[parameter]]
key = "size_mgram"
label_pl = "Ngram draft"
label_en = "Ngram draft"
kind = "int"
default = 4
range = { min = 1.0, max = 64.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "size_mgram" } ]

[[model_preset]]
id = "qwen3-5-0-8b-q4"
display_name = "Qwen 3.5 0.8B Q4_K_M"
repo = "Qwen/Qwen3.5-0.8B-GGUF"
quantization = "Q4_K_M"
recommended = true

