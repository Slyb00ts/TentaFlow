# Manifest serwisu llama.cpp — wbudowany engine LLM (GGUF) na wszystkie platformy.

[engine]
id = "llama-cpp"
category = "llm"
name = "llama.cpp"
description_pl = "Lekki silnik LLM w C/C++. Obsluguje GGUF i embeddingi. Dziala wszedzie."
description_en = "Lightweight C/C++ LLM engine. Supports GGUF and embeddings."
homepage = "https://github.com/ggerganov/llama.cpp"
license = "MIT"
icon = "llama-cpp"
default_port = 8080
api = "openai-compatible"
version = "b3974"

[deploy.docker]
context_path = "llm/docker/llama-cpp"
platforms = ["linux", "windows"]
transport = "direct-http"
gguf_model_mount = true

[deploy.native]
platforms = ["linux", "macos", "windows", "ios", "android"]
runtime = "embedded"
feature_flag = "inference-llamacpp"

[[parameter]]
key = "speculative_method"
label_pl = "Speculative decoding"
label_en = "Speculative decoding"
kind = "enum"
options = ["off", "mtp", "ngram-simple"]
default = "off"
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "speculative_method" } ]

[[parameter]]
key = "flash_attn"
label_pl = "Flash Attention"
label_en = "Flash Attention"
kind = "enum"
options = ["auto", "off", "on"]
default = "auto"
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "flash_attn" } ]

[[parameter]]
key = "num_speculative_tokens"
label_pl = "Tokeny MTP"
label_en = "MTP tokens"
kind = "int"
default = 4
range = { min = 1.0, max = 16.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "num_speculative_tokens" } ]

[[parameter]]
key = "size_ngram"
label_pl = "Ngram lookback"
label_en = "Ngram lookback"
kind = "int"
default = 3
range = { min = 1.0, max = 16.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "size_ngram" } ]

[[parameter]]
key = "size_mgram"
label_pl = "Ngram draft"
label_en = "Ngram draft"
kind = "int"
default = 4
range = { min = 1.0, max = 64.0, step = 1.0 }
bindings = [ { when = "native_embedded", type = "llamacpp_field", field = "size_mgram" } ]

[[model_preset]]
id = "qwen3-5-0-8b-q4"
display_name = "Qwen 3.5 0.8B Q4_K_M"
repo = "Qwen/Qwen3.5-0.8B-GGUF"
quantization = "Q4_K_M"
recommended = true

[[model_preset]]
id = "nemotron-3-super-120b-a12b-gguf"
display_name = "Nemotron 3 Super 120B (GGUF Q4_K_M)"
repo = "unsloth/NVIDIA-Nemotron-3-Super-120B-A12B-GGUF"
quantization = "Q4_K_M"
