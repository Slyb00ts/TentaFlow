LLAMA_RUNTIME_IMAGE = "nvidia/cuda:13.0.3-runtime-ubuntu24.04"
LLAMA_CMAKE_FLAGS = "-DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-real;100-real;103-real;120-real"

