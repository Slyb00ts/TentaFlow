# Manifest serwisu llama.cpp — wbudowany engine LLM (GGUF) na wszystkie platformy.

[engine]
id = "llama-cpp"
category = "llm"
name = "llama.cpp"
description_pl = "Lekki silnik LLM w C/C++. Obsluguje GGUF i embeddingi. Dziala wszedzie."
description_en = "Lightweight C/C++ LLM engine. Supports GGUF and embeddings."
homepage = "https://github.com/ggerganov/llama.cpp"
license = "MIT"
icon = "llama-cpp"
default_port = 8080
api = "openai-compatible"
version = "b3974"

[deploy.docker]
context_path = "llm/docker/llama-cpp"
platforms = ["linux", "windows"]
transport = "direct-http"
gguf_model_mount = true

# Domyslnie CPU: obraz musi sie zbudowac na kazdym hoscie. Wariant CUDA wchodzi
# tylko wtedy, gdy Core wykryje karte NVIDIA — inaczej build konczy sie na
# linkerze szukajacym libcuda.so.1, po godzinie kompilacji.
[deploy.docker.default_build_args]
LLAMA_BUILDER_IMAGE = "ubuntu:24.04"
LLAMA_RUNTIME_IMAGE = "ubuntu:24.04"
LLAMA_CMAKE_FLAGS = "-DGGML_NATIVE=OFF"

[deploy.native]
platforms = ["linux", "macos", "windows", "ios", "android"]
runtime = "embedded"
feature_flag = "inference-llamacpp"

[deploy.docker.arch_variants.cuda.build_args]
LLAMA_BUILDER_IMAGE = "nvidia/cuda:13.0.3-devel-ubuntu24.04"
LLAMA_RUNTIME_IMAGE = "nvidia/cuda:13.0.3-runtime-ubuntu24.04"
LLAMA_CMAKE_FLAGS = "-DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-real;100-real;103-real;120-real"

[deploy.docker.arch_variants.cuda-turing.build_args]
