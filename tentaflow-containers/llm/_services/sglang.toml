# Manifest serwisu SGLang — serwer LLM z RadixAttention (Linux/Windows GPU).

[engine]
id = "sglang"
category = "llm"
name = "SGLang"
description_pl = "Serwer LLM z RadixAttention i strukturalnym output. Szybsze od vLLM dla zlozonych zapytan."
description_en = "LLM server with RadixAttention and structured output. Faster than vLLM for complex prompts."
homepage = "https://github.com/sgl-project/sglang"
license = "Apache-2.0"
icon = "sglang"
default_port = 30000
api = "openai-compatible"
version = "0.5.17"

[deploy.docker]
context_path = "llm/docker/sglang"
platforms = ["linux", "windows"]
transport = "direct-http"

# Hardware-aware build. Default = Blackwell/Hopper (cu130 + prebuilt sgl-kernel,
# ktore ma kernele sm90/sm100) — DZIALA na B200/B300/GB10/H100.
# UWAGA Ampere/Ada (sm80/86/89): sglang NIE dziala. prebuilt sgl-kernel 0.3.21 na
# ZADNYM indeksie (PyPI / docs.sglang.ai cu129 / cu130) nie ma kerneli sm80/86/89
# — tylko sm90/sm100; a build ze zrodel pod sm86 nie kompiluje sie czysto na cu13.
# (Docs sglang "sm75+" dotyczy FlashInfer-attention, nie sgl_kernel custom-ops.)
# Na Ampere/Ada uzywaj vLLM (dziala). Gdy sglang dostanie prebuilt sm8x, wystarczy
# dodac tu arch_variants z SGL_KERNEL_INDEX — Dockerfile to obsluguje.
[deploy.docker.default_build_args]
CUDA_IMAGE = "nvidia/cuda:13.0.3-devel-ubuntu24.04"
TORCH_INDEX = "https://download.pytorch.org/whl/cu130"
SGLANG_VERSION = "0.5.17"

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "llm/python/sglang"

[[model_preset]]
id = "qwen3-5-0-8b"
display_name = "Qwen 3.5 0.8B"
repo = "Qwen/Qwen3.5-0.8B"
recommended = true
