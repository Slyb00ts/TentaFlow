# Manifest serwisu vLLM-DSpark — dedykowany runtime DeepSeek V4 Flash na
# klaster 2x DGX Spark (GB10, sm_121a). Osobny silnik od `vllm-spark.toml`, bo
# bazuje na prebuiltowym obrazie vLLM 0.24 (unholy-fusion) + overlay/patche
# nvfp4_ds_mla z przepisu tonyd2wild (zweryfikowany deploy 2026-07-04,
# 50-60 tok/s code na 2 Sparkach po RoCE). Cluster-only: 284B MoE nie miesci
# sie na jednym Sparku; deploy uzywa natywnego multi-node vLLM
# (`--nnodes/--node-rank/--headless`, worker-first), NIE Raya — patrz
# `cluster_launch = "vllm-mp"` i `services/deploy/distributed.rs`.
# Ten profil pozostaje legacy, bo zewnetrzny obraz i overlay nie sa zgodne z vLLM
# 0.27.1. Aktualizowana sciezka zrodlowa znajduje sie w `vllm-dspark-src`.

[engine]
id = "vllm-dspark"
backend = "vllm"  # served by vLLM — drives gpu_memory_utilization + VRAM calculator
category = "llm"
name = "DeepSeek V4 Flash DSpark (2-8x Spark)"
description_pl = "DeepSeek V4 Flash 284B MoE z DSpark spec-decode i NVFP4 KV-cache na klaster 2x DGX Spark (RoCE). 50-60 tok/s."
description_en = "DeepSeek V4 Flash 284B MoE with DSpark spec-decode and NVFP4 KV cache on a 2x DGX Spark cluster (RoCE). 50-60 tok/s."
homepage = "https://github.com/tonyd2wild/DeepSeek-v4-Flash-DSpark-1M-NVFP4-KV-2x-DGX-Spark"
license = "Apache-2.0"
icon = "vllm"
default_port = 8000
api = "openai-compatible"
version = "0.24.0"
# Silnik widoczny TYLKO na Sparku — manifest-store filtruje po polu engine.dgx_spark.
dgx_spark = true
# Cluster-ONLY: single-node deploy nie ma sensu (model nie miesci sie na 119GB).
cluster_capable = true
# Multi-node przez natywny vLLM mp (--nnodes/--headless, worker-first), nie Ray.
cluster_launch = "vllm-mp"
# Obraz jest przypiety do JEDNEGO checkpointu (patche nvfp4_ds_mla), wiec silnik
# nie ma sensu w oderwaniu od swojego presetu. Katalog pokazuje tylko kafelek
# modelu; kafelek silnika nazwany modelem czytal sie jak jego duplikat.
preset_only = true

[deploy.docker]
context_path = "llm/docker/vllm-dspark"
platforms = ["linux"]
transport = "direct-http"

# Zweryfikowany profil "C12": pula KV ~3.2M tokenow na 2 Sparkach. Przy 256k
# kontekstu per user 12 rownoleglych slotow wypelnia pule (12 x 262144 = 3.1M).
# Kontekst (max_model_len) i gpu_memory_utilization ustawiane w wizardzie;
# max-num-seqs mozna nadpisac w polu vllm_args (`--max-num-seqs N
# --max-cudagraph-capture-size N`). Sufit YaRN modelu = 1M (1048576).
[[model_preset]]
id = "deepseek-v4-flash-0731"
display_name = "DeepSeek V4 Flash 0731 (NVFP4, DSpark, 1M ctx, cluster 2-8x Spark)"
repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
# Oficjalne wydanie z 2026-07-31, zastepuje preview: mocniejsze agentowo, ta sama
# architektura (konfiguracja serwowania przenosi sie 1:1). Wagi to ta sama
# mieszanka FP4+FP8 co preview (eksperci MoE w I8 po dwie wartosci 4-bit + skale
# E8M0), wiec osobny "wariant NVFP4" nie istnieje i nie jest potrzebny.
quantization = "nvfp4"
# DSpark, nie MTP: glowa draftujaca siedzi w checkpoincie i jest ~1.2-1.4x
# szybsza od stockowego MTP przy tej samej jakosci (spekulacja jest bezstratna).
speculator_method = "dspark"
# k MUSI rownac sie `dspark_block_size` checkpointu. UWAGA: karta modelu 0731
# podaje 7, ale jego wlasny config.json deklaruje 5 — sprawdzone na pobranych
# plikach. Bierzemy wartosc z checkpointu, nie z dokumentacji.
speculator_num_tokens = 5
recommended = true
featured = true

# Wartosci z karty modelu 0731. `temperature = 1.0` jest nietypowa (wiekszosc
# modeli chce ~0.7), wiec bez jawnego ustawienia serwer wystartowalby z domyslem,
# przy ktorym ten model odpowiada gorzej. `top_p = 0.95` to profil agentowy.
[model_preset.sampling]
temperature = 1.0
top_p = 0.95
