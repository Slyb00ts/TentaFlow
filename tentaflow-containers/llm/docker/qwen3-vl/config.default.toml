# =============================================================================
# Plik: config.default.toml
# Opis: Fallback dla sidecara w obrazie Qwen3-VL - nadpisany przez
#       /data/config.toml wygenerowany przez tentaflow-core/src/deploy/runner.rs
#       przy deployu. Proxuje /v1 (w tym /v1/chat/completions) z vLLM.
# =============================================================================
service_name = "llm-qwen3-vl"
model_aliases = []

[transport]
port = 5000
enable_lan_discovery = false
enable_dht_discovery = false

[role]
kind = "reverse_proxy"
upstream_url = "http://127.0.0.1:8000/v1"
api = "open_ai"
timeout_ms = 600000
