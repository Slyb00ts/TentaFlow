[engine]
id = "codex"
category = "agents"
resource_kind = "ai"
provider = "external"
name = "Codex"
description_pl = "Oficjalny Codex CLI z trwałymi sesjami, narzędziami i dostępem do workspace."
description_en = "Official Codex CLI with durable sessions, tools, and workspace access."
homepage = "https://github.com/openai/codex"
license = "Apache-2.0"
icon = "codex"
default_port = 8765
api = "custom"
# Required by the manifest schema. A managed-cli engine installs whatever the
# vendor's release channel reports as newest, so this is a label, not a pin.
version = "latest"
requires_model = false
gpu_supported = false
service_surfaces = ["chat"]
input_modalities = ["text"]
output_modalities = ["text"]

[deploy.native]
platforms = ["linux", "macos"]
runtime = "managed-cli"
binary_path = "agents/native/coding-agent-bridge"
