[engine]
id = "grok-build"
category = "agents"
resource_kind = "ai"
provider = "external"
name = "Grok Build"
description_pl = "Grok Build przez ACP, z osobnym kontem i izolowanym dostępem do projektu."
description_en = "Grok Build over ACP, with a separate account and isolated project access."
homepage = "https://docs.x.ai/build/cli/headless-scripting"
