[engine]
id = "grok-build"
category = "agents"
resource_kind = "ai"
provider = "external"
name = "Grok Build"
description_pl = "Grok Build przez ACP, z osobnym kontem i izolowanym dostępem do projektu."
description_en = "Grok Build over ACP, with a separate account and isolated project access."
homepage = "https://docs.x.ai/build/cli/headless-scripting"
license = "Proprietary"
icon = "code"
default_port = 8767
api = "custom"
# Required by the manifest schema. A managed-cli engine installs whatever the
# vendor's release channel reports as newest, so this is a label, not a pin.
version = "latest"
requires_model = false
gpu_supported = false
service_surfaces = ["chat"]
input_modalities = ["text"]
output_modalities = ["text"]

[deploy.native]
platforms = ["linux", "macos"]
runtime = "managed-cli"
binary_path = "agents/native/coding-agent-bridge"
