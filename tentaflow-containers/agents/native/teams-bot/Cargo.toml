[package]
name = "tentaflow-teams-bot"
version = "0.1.0"
edition = "2021"
description = "Sidecar do spotkan Teams — automatyzacja przegladarki + audio pipeline"

[[bin]]
name = "tentaflow-meeting"
path = "src/main.rs"

[dependencies]
# Protokol i transport iroh
tentaflow-protocol = { workspace = true }
tentaflow-transport = { workspace = true }
iroh = { workspace = true, features = ["portmapper", "tls-ring"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Automatyzacja przegladarki
chromiumoxide = { workspace = true }
futures = { workspace = true }

# WebSocket serwer localhost — most audio miedzy Chromium (JS) a Rust
tokio-tungstenite = { workspace = true }

# Lock-free atomic snapshot — uzywany dla roster JSON cache (dom_observer ->
# STT hot path). Pozwala uniknac async RwLock + serde_json::to_string per
# segment STT.
arc-swap = { workspace = true }

# Silero VAD — pure Rust implementation z tentaflow-voice
tentaflow-voice = { workspace = true }
parking_lot = { workspace = true }

# Konfiguracja
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# CLI
clap = { workspace = true, features = ["derive"] }

# Inne
anyhow = { workspace = true }
hex = { workspace = true, default-features = true }
uuid = { workspace = true, features = ["v4"] }
bytemuck = { workspace = true }
# Dekodowanie base64 z DomEvent::VideoFrame — JS→Rust przez CDP binding nosi
# tylko JSON, więc binarne klatki idą jako base64; tu wracamy do bajtów
# zanim payload trafi do CBOR.
base64 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports", "async_tokio"] }

[[bench]]
name = "noop"
harness = false

[[bench]]
name = "vad_chunk_processing"
harness = false

[[bench]]
name = "prepad_ringbuffer"
harness = false

[[bench]]
name = "roster_emit_concurrency"
harness = false
