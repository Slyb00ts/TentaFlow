[package]
name = "tentaflow-coding-agent-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
anyhow = { workspace = true }
axum = { workspace = true }
parking_lot = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
fs2 = { workspace = true }

# Process groups and signals. A CLI spawns helpers of its own, so "closed" has
# to mean `killpg` + `waitpid`, not a dropped handle (defect D2 of §1.2).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
