[package]
name = "tentaflow-coding-agent-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
parking_lot = "0.12"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.15"

# Process groups and signals. A CLI spawns helpers of its own, so "closed" has
# to mean `killpg` + `waitpid`, not a dropped handle (defect D2 of §1.2).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
