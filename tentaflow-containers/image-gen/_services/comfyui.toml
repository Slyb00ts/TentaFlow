# Manifest serwisu ComfyUI — node-based image generation pipeline.

[engine]
id = "comfyui"
category = "image-gen"
name = "ComfyUI"
description_pl = "Silnik generowania obrazow oparty o graf wezlow. Stable Diffusion, Flux i inne."
description_en = "Node-based image generation engine. Stable Diffusion, Flux and more."
homepage = "https://github.com/comfyanonymous/ComfyUI"
license = "GPL-3.0"
icon = "comfyui"
default_port = 5000
api = "comfyui"
version = "0.3.10"
service_surfaces = ["image_gen"]
input_modalities = ["text"]
output_modalities = ["image"]

[deploy.docker]
context_path = "image-gen/docker/comfyui"
platforms = ["linux", "windows"]
transport = "direct-http"

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "image-gen/python/comfyui"

[[model_preset]]
id = "sd-1-5"
display_name = "Stable Diffusion 1.5"
# Publiczne, niezbramkowane archiwum SD1.5 (oryginalne runwayml/ zostalo usuniete z HF).
# checkpoint_file to plik pobierany na host i montowany w models/checkpoints kontenera.
repo = "Comfy-Org/stable-diffusion-v1-5-archive"
checkpoint_file = "v1-5-pruned-emaonly-fp16.safetensors"
recommended = true
