# =============================================================================
# Plik: pyproject.toml
# Opis: Definicja środowiska `uv` dla natywnego serwera treningowego czytnika OCR
#       tablic (CRNN + CTC). torch z CUDA 13.0 z indeksu PyTorch (Blackwell/B300).
# =============================================================================

[project]
name = "tentaflow-ocr-training"
version = "1.0.0"
description = "TentaFlow ADR placard OCR training server (CRNN + CTC)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.12.1",
    "pillow>=10.0.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "onnx>=1.20.0,<2.0",
    "onnxruntime>=1.20.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
