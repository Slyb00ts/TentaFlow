# =============================================================================
# Plik: pyproject.toml
# Opis: Definicja środowiska `uv` dla natywnego serwera treningowego RF-DETR.
#       torch z CUDA 12.1 z indeksu PyTorch; rfdetr z extras [train].
# =============================================================================

[project]
name = "tentaflow-rfdetr-training"
version = "1.0.0"
description = "TentaFlow RF-DETR object detection training server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "rfdetr[train]==1.7.1",
    "pycocotools==2.0.8",
    "onnx==1.17.0",
    "onnxruntime==1.19.2",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
