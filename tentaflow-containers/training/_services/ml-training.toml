# Manifest serwisu ML Training — serwer fine-tuningu LLM oparty o Hugging Face
# (transformers + peft + trl). Realne SFT / LoRA / QLoRA / DPO sterowane przez
# REST API (POST /train). Model bazowy jest parametrem JOBA, nie wybierany przy
# deployu — dlatego requires_model = false. Presety ponizej to tylko podpowiedzi
# dobrych modeli bazowych do fine-tune, podawane potem w polu `base_model`.

[engine]
id = "ml-training"
category = "training"
name = "ML Training (HF)"
description_pl = "Serwer treningowy LLM (Hugging Face): SFT, LoRA, QLoRA, DPO. Model bazowy i dane podajesz per job przez REST API."
description_en = "LLM training server (Hugging Face): SFT, LoRA, QLoRA, DPO. Base model and data are supplied per job over a REST API."
homepage = "https://github.com/huggingface/transformers"
license = "Apache-2.0"
icon = "brain"
default_port = 8200
api = "custom"
version = "1.0.0"
requires_model = false

[deploy.docker]
context_path = "training/docker/ml-training"
platforms = ["linux"]
transport = "direct-http"

[deploy.native]
platforms = ["linux"]
runtime = "python-bundle"
bundle_path = "training/python/ml-training"

[[model_preset]]
id = "qwen3-5-0-8b"
display_name = "Qwen 3.5 0.8B"
repo = "Qwen/Qwen3.5-0.8B"
recommended = true

[[model_preset]]
id = "llama-3-2-1b"
display_name = "Llama 3.2 1B"
repo = "meta-llama/Llama-3.2-1B"

[[model_preset]]
id = "qwen2-5-7b"
display_name = "Qwen 2.5 7B"
repo = "Qwen/Qwen2.5-7B"
