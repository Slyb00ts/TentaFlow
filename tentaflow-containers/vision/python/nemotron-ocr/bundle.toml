# =============================================================================
# Plik: bundle.toml
# Opis: Native Python bundle dla Nemotron-OCR (nvidia/nemotron-ocr-v1). Model NIE
#       jest modelem transformers — to pakiet `nemotron-ocr` z repo HF z wlasnym
#       pipeline'em (detector+recognizer+relational) i rozszerzeniem CUDA C++
#       (hatch_build → nvcc). Instalujemy go z --no-build-isolation (widzi torch),
#       z GIT_LFS_SKIP_SMUDGE=1 (klon bez wag LFS; wagi pobiera pipeline w runtime).
#       Wymaga nvcc na hoscie (toolkit CUDA). Tylko CUDA. server.py wystawia /ocr.
# =============================================================================

[bundle]
engine = "nemotron-ocr"
description = "NVIDIA Nemotron-OCR document OCR server (CUDA only)"
python_version = "3.12"
source = "pypi"
pypi_package = "huggingface_hub"

[launch]
command = "uvicorn"
args = ["--app-dir", "${BUNDLE_DIR}", "server:app",
        "--host", "127.0.0.1", "--port", "${PORT:-8093}"]
internal_port = 8093

[requires]
gpu_memory_gb = 8
disk_gb = 12
platforms = ["linux-x86_64", "windows-x86_64"]

# Tylko CUDA — model nie ma sciezki CPU. torch+torchvision z wheelami cu130 +
# zaleznosci runtime pipeline'u (shapely/pandas/scikit-learn/numpy/pillow) oraz
# backend buildu (hatchling/setuptools). Sam pakiet nemotron-ocr instalujemy w
# extras_no_build_isolation, zeby hatch_build widzial zainstalowany torch.
[[install_variants]]
backend = "cuda"
extra_index = "https://download.pytorch.org/whl/cu130"
extras = ["torch==2.11.0", "torchvision==0.26.0", "pillow>=12", "shapely", "pandas", "scikit-learn", "numpy", "fastapi==0.115.6", "uvicorn==0.34.0", "python-multipart", "hatchling", "setuptools"]
extras_no_build_isolation = ["nemotron-ocr @ git+https://huggingface.co/nvidia/nemotron-ocr-v1#subdirectory=nemotron-ocr"]
# GIT_LFS_SKIP_SMUDGE: klon repo HF bez wag .pth (LFS) — wagi pobiera pipeline
# w runtime. TORCH_CUDA_ARCH_LIST NIE jest tu ustawiany na sztywno: rozszerzenie
# CUDA nemotron-ocr (quad_nms przez nvcc) buduje sie tylko pod podane arch, a deploy
# (python_venv.rs) wstrzykuje DOKLADNY arch pod wykryte GPU hosta, wiec kazdy host
# kompiluje kernel pod swoja realna karte (Ampere 8.6 .. Blackwell 10.3) — bez
# fat-binary i bez wariantow per-arch.
env = { GIT_LFS_SKIP_SMUDGE = "1" }
install_hint = "CUDA_VISIBLE_DEVICES=0; wymaga nvcc (toolkit CUDA) na hoscie"
