# =============================================================================
# Plik: nemotron-table-structure.toml
# Opis: Manifest detektora struktury tabel (YOLOX, NVIDIA NeMo Retriever).
#       Wykrywa wiersze, kolumny i komorki tabel do rekonstrukcji ich struktury
#       przy ekstrakcji. Wagi PyTorch .pth z HF; deploy eksportuje je do ONNX i
#       serwuje detekcje przez onnxruntime (CPU/CUDA/ROCm) - wspolny
#       python-bundle vision/python/nemotron-yolox. Custom API /detect.
# =============================================================================

[engine]
id = "nemotron-table-structure"
category = "vision"
name = "Nemotron Table Structure"
description_pl = "Detektor struktury tabel (YOLOX, NeMo Retriever). Wykrywa wiersze/kolumny/komorki do rekonstrukcji tabel. Wagi .pth -> ONNX przy deployu."
description_en = "Table-structure detector (YOLOX, NeMo Retriever). Detects rows/columns/cells to reconstruct tables. .pth -> ONNX export at deploy."
homepage = "https://huggingface.co/nvidia/nemotron-table-structure-v1"
license = "Apache-2.0"
icon = "yolo"
resource_kind = "ai"
default_port = 5088
api = "custom"
version = "v1"
service_surfaces = ["documents"]
input_modalities = ["image"]
output_modalities = ["text"]

[deploy.docker]
context_path = "vision/docker/nemotron-yolox"
platforms = ["linux", "windows"]
transport = "sidecar-quic"

[deploy.native]
platforms = ["linux", "macos", "windows"]
runtime = "python-bundle"
bundle_path = "vision/python/nemotron-yolox"

[[model_preset]]
id = "nemotron-table-structure-v1"
display_name = "Nemotron Table Structure v1"
repo = "nvidia/nemotron-table-structure-v1"
recommended = true
