# =============================================================================
# Plik: paddle-ocr-mlx.toml
# Opis: Manifest serwisu PaddleOCR-MLX — wariant PaddleOCR-VL na Apple Silicon
#       (port MLX). Wbudowany engine (embedded) dla macOS/iOS, bez kontenera
#       docker i bez bundla python. Surface "documents", wejscie obraz,
#       wyjscie tekst + layout.
# =============================================================================

[engine]
id = "paddle-ocr-mlx"
category = "vision"
name = "PaddleOCR (MLX)"
description_pl = "PaddleOCR-VL na Apple Silicon (MLX). Wbudowany OCR/parsing dokumentow dla macOS/iOS. Zwraca tekst z ukladem strony."
description_en = "PaddleOCR-VL on Apple Silicon (MLX). Embedded document OCR/parsing for macOS/iOS. Returns text with page layout."
homepage = "https://huggingface.co/mlx-community/paddleocr-vl.swift"
license = "Apache-2.0"
icon = "vision"
default_port = 0
api = "custom"
version = "vl-mlx"
service_surfaces = ["documents"]
input_modalities = ["image"]
output_modalities = ["text"]

[deploy.native]
platforms = ["macos", "ios"]
runtime = "embedded"
# Bez feature flag — silnik (PaddleOCR-VL MLX) jest wkompilowany zawsze na
# macOS/iOS (gating target_os, jak apple-ocr). Vendored w MLXBridge.

# Wagi oryginalnego PaddleOCR-VL (config.json + safetensors + tokenizer) —
# port MLX (vendored w MLXBridge, PaddleOCRVLModel.load + AutoTokenizer.from)
# laduje je wprost z tego katalogu. NIE repo swift-package (to tylko kod).
[[model_preset]]
id = "paddleocr-vl-mlx"
display_name = "PaddleOCR-VL (MLX)"
repo = "PaddlePaddle/PaddleOCR-VL"
recommended = true

# Wariant juz-skonwertowany do MLX (alternatywa, gdy port nie laduje oryginalu).
[[model_preset]]
id = "paddleocr-vl-mlx-gamhtoi"
display_name = "PaddleOCR-VL-MLX (prekonwertowany)"
repo = "gamhtoi/PaddleOCR-VL-MLX"
