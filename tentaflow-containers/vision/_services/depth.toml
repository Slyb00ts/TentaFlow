# =============================================================================
# Plik: depth.toml
# Opis: Manifest serwisu szacowania GŁĘBI z obrazu (monocular depth) — Depth
#       Anything V2 (relatywny i METRYCZNY), ZoeDepth oraz MiDaS (Intel DPT).
#       Jeden serwis, wiele presetów modeli; MODEL wybiera rodzinę. Surface
#       "depth": wejście obraz, wyjście mapa głębi (image). Konsumowany wewnętrznie
#       (Robots → chmura punktów → wspólna mapa; WYMAGA modelu metrycznego) i na
#       zewnątrz przez REST `POST /v1/depth`. Deploy: docker (direct-http) + native
#       python-bundle. Wszystkie presety działają przez `transformers`
#       `pipeline("depth-estimation")`, więc dzielą jeden server.py.
#       UWAGA: Depth Anything V3 (repo `depth-anything/DA3-*`) to model
#       WIELOWIDOKOWY (geometria + pozy) i NIE działa przez ten pipeline — wymaga
#       osobnego serwera, więc nie ma go tu w presetach.
# =============================================================================

[engine]
id = "depth"
category = "vision"
name = "Szacowanie głębi (Depth Anything / MiDaS)"
description_pl = "Monocular depth z obrazu: Depth Anything V2 (relatywny i metryczny), ZoeDepth oraz MiDaS (Intel DPT). Zwraca mapę głębi (f32) do rekonstrukcji chmury punktów i map 3D z samej kamery."
description_en = "Monocular depth from a single image: Depth Anything V2 (relative and metric), ZoeDepth and MiDaS (Intel DPT). Returns an f32 depth map for point-cloud reconstruction and camera-only 3D maps."
homepage = "https://github.com/DepthAnything/Depth-Anything-V2"
license = "apache-2.0"
icon = "vision"
default_port = 8096
api = "custom"
version = "1.0.0"
service_surfaces = ["depth"]
input_modalities = ["image"]
output_modalities = ["image"]

[deploy.native]
platforms = ["linux", "windows", "macos"]
runtime = "python-bundle"
bundle_path = "vision/python/depth"

[deploy.docker]
context_path = "vision/docker/depth"
platforms = ["linux", "windows"]
transport = "direct-http"

# Depth Anything V2 — relatywna głębia (dobra do podglądu / REST, NIE do mapy).
[[model_preset]]
id = "depth-anything-v2-large"
display_name = "Depth Anything V2 Large (relatywny)"
repo = "depth-anything/Depth-Anything-V2-Large-hf"

# MiDaS — rodzina Intel DPT (do porównania).
[[model_preset]]
id = "midas-dpt-large"
display_name = "MiDaS — DPT Large"
repo = "Intel/dpt-large"

[[model_preset]]
id = "midas-dpt-hybrid"
display_name = "MiDaS — DPT Hybrid"
repo = "Intel/dpt-hybrid-midas"

# METRYCZNE modele — zwracają głębię w METRACH, więc chmura punktów jest od razu
# kompatybilna z lidarem. WYMAGANE do budowy wspólnej mapy z kamery (depth_mapping).
# `is_metric` wykrywany po nazwie repo ("metric"/"zoedepth").
#
# Wybór indoor vs outdoor: ZoeDepth NK (NYU+KITTI) ma WBUDOWANY router domeny i
# sam dobiera głowicę indoor/outdoor — dlatego jest DOMYŚLNY (serwis i zewnętrzny
# integrator NIE muszą z góry wiedzieć, czy scena jest w środku czy na zewnątrz,
# a robot może wchodzić/wychodzić). Domenowe DA V2 Metric Indoor/Outdoor dają
# WIĘKSZĄ dokładność, ale TYLKO gdy z góry znasz scenę (stały robot w hali / znana
# integracja) — w złej domenie skala jest błędna.
[[model_preset]]
id = "zoedepth-nyu-kitti"
display_name = "ZoeDepth NYU+KITTI (metryczny, auto indoor/outdoor)"
repo = "Intel/zoedepth-nyu-kitti"
recommended = true

[[model_preset]]
id = "depth-anything-v2-metric-indoor-large"
display_name = "Depth Anything V2 Metric — Indoor Large (tylko wnętrza)"
repo = "depth-anything/Depth-Anything-V2-Metric-Indoor-Large-hf"

[[model_preset]]
id = "depth-anything-v2-metric-outdoor-large"
display_name = "Depth Anything V2 Metric — Outdoor Large (tylko zewnątrz)"
repo = "depth-anything/Depth-Anything-V2-Metric-Outdoor-Large-hf"
