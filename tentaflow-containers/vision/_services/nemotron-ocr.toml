# =============================================================================
# Plik: nemotron-ocr.toml
# Opis: Manifest serwisu Nemotron-OCR (NVIDIA nvidia/nemotron-ocr-v1) —
#       silnik OCR dokumentow oparty o RegNetY + transformer, dziala wylacznie
#       na CUDA. Deploy native jako python-bundle (tylko wariant cuda) oraz
#       docker z sidecarem QUIC. Surface "documents", wejscie obraz, wyjscie
#       tekst + layout.
# =============================================================================

[engine]
id = "nemotron-ocr"
category = "vision"
name = "Nemotron OCR"
description_pl = "OCR dokumentow NVIDIA Nemotron-OCR (RegNetY + transformer). Tylko CUDA. Zwraca tekst z ukladem strony."
description_en = "NVIDIA Nemotron-OCR document OCR (RegNetY + transformer). CUDA only. Returns text with page layout."
homepage = "https://huggingface.co/nvidia/nemotron-ocr-v1"
license = "nvidia-open-model-license"
icon = "vision"
default_port = 8093
api = "custom"
version = "v1"
service_surfaces = ["documents"]
input_modalities = ["image"]
output_modalities = ["text"]

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "vision/python/nemotron-ocr"

[deploy.docker]
context_path = "vision/docker/nemotron-ocr"
platforms = ["linux", "windows"]
transport = "sidecar-quic"

[[model_preset]]
id = "nemotron-ocr-v1"
display_name = "Nemotron OCR v1"
repo = "nvidia/nemotron-ocr-v1"
recommended = true
