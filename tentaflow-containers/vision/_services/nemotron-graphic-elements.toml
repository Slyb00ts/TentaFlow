# =============================================================================
# Plik: nemotron-graphic-elements.toml
# Opis: Manifest detektora elementow graficznych (YOLOX, NVIDIA NeMo Retriever).
#       Wykrywa wykresy, schematy i komponenty grafik (osie, legendy, slupki)
#       do ekstrakcji danych z grafik. Wagi PyTorch .pth z HF; deploy eksportuje
#       je do ONNX i serwuje detekcje przez onnxruntime (CPU/CUDA/ROCm) -
#       wspolny python-bundle vision/python/nemotron-yolox. Custom API /detect.
# =============================================================================

[engine]
id = "nemotron-graphic-elements"
category = "vision"
name = "Nemotron Graphic Elements"
description_pl = "Detektor elementow graficznych (YOLOX, NeMo Retriever). Wykrywa komponenty wykresow/schematow do ekstrakcji. Wagi .pth -> ONNX przy deployu."
description_en = "Graphic-element detector (YOLOX, NeMo Retriever). Detects chart/diagram components for extraction. .pth -> ONNX export at deploy."
homepage = "https://huggingface.co/nvidia/nemotron-graphic-elements-v1"
license = "Apache-2.0"
icon = "yolo"
resource_kind = "ai"
default_port = 5087
api = "custom"
version = "v1"
service_surfaces = ["documents"]
input_modalities = ["image"]
output_modalities = ["text"]

[deploy.docker]
context_path = "vision/docker/nemotron-yolox"
platforms = ["linux", "windows"]
transport = "sidecar-quic"

[deploy.native]
platforms = ["linux", "macos", "windows"]
runtime = "python-bundle"
bundle_path = "vision/python/nemotron-yolox"

[[model_preset]]
id = "nemotron-graphic-elements-v1"
display_name = "Nemotron Graphic Elements v1"
repo = "nvidia/nemotron-graphic-elements-v1"
recommended = true
