# =============================================================================
# Plik: nemotron-parse.toml
# Opis: Manifest serwisu Nemotron-Parse (NVIDIA NVIDIA-Nemotron-Parse-v1.2) —
#       parser dokumentow (C-RADIO ViT-H + mBART 885M) zwracajacy tekst +
#       strukture/uklad. Deploy native jako python-bundle (transformers,
#       warianty cuda + rocm) oraz docker z sidecarem QUIC.
# =============================================================================

[engine]
id = "nemotron-parse"
category = "vision"
name = "Nemotron Parse"
description_pl = "Parser dokumentow NVIDIA Nemotron-Parse (C-RADIO ViT-H + mBART 885M). Zwraca tekst i strukture (layout/markdown). GPU: CUDA lub ROCm."
description_en = "NVIDIA Nemotron-Parse document parser (C-RADIO ViT-H + mBART 885M). Returns text and structure (layout/markdown). GPU: CUDA or ROCm."
homepage = "https://huggingface.co/nvidia/NVIDIA-Nemotron-Parse-v1.2"
license = "nvidia-open-model-license"
icon = "vision"
default_port = 8094
# API zgodne z NVIDIA nemoretriever-parse: model jest VLM serwowanym po
# OpenAI `/v1/chat/completions`, dlatego klasyfikujemy go jako `chat` z wejsciem
# image — Core rozwiazuje go ta sama sciezka vision-chat co inne VLM, a
# `openai-compatible` sprawia ze endpoint dostaje `/v1` (`.../v1/chat/completions`).
api = "openai-compatible"
version = "v1.2"
service_surfaces = ["chat"]
input_modalities = ["text", "image"]
output_modalities = ["text"]

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "vision/python/nemotron-parse"

[deploy.docker]
context_path = "vision/docker/nemotron-parse"
platforms = ["linux", "windows"]
transport = "direct-http"

[[model_preset]]
id = "nemotron-parse-v1-2"
display_name = "Nemotron Parse v1.2"
repo = "nvidia/NVIDIA-Nemotron-Parse-v1.2"
recommended = true
