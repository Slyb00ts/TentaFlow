[bundle]
engine = "parakeet"
description = "NVIDIA NeMo Parakeet-TDT-0.6B-v3 (STT)"
python_version = "3.12"
source = "git"
git_repo = "https://github.com/NVIDIA/NeMo.git"
# Tag musi byc spojny z `nemo_toolkit[asr]==2.6.2` w install_variants.extras —
# inaczej git checkout (HEAD) wciaga lhotse z PyPI transitive deps, ktora
# nie ma symboli wymaganych przez nowszy NeMo (ImportError: Compress).
git_ref = "v2.6.2"

[launch]
command = "uvicorn"
args = ["--app-dir", "${BUNDLE_DIR}", "server:app",
        "--host", "127.0.0.1", "--port", "${PORT:-8082}"]
internal_port = 8082

[requires]
gpu_memory_gb = 4
disk_gb = 12
# NeMo jest oficjalnie CUDA-only; ROCm ma ograniczone wsparcie eksperymentalne.
platforms = ["linux-x86_64", "linux-aarch64", "windows-x86_64"]

[[install_variants]]
backend = "cuda"
# B300/sm_103 wymaga torch cu130 (cu124 nie ma kerneli sm_103); spojne z Dockerfile.
extra_index = "https://download.pytorch.org/whl/cu130"
# Pinned na 2.6.2 (Feb 2026) — wspiera Parakeet-TDT-0.6B-v3 multilingual.
extras = ["torch==2.11.0", "torchaudio==2.11.0", "nemo_toolkit[asr]==2.6.2"]
# NeMo 2.6.2 pinuje lhotse==1.31.1, ktora pada na torch 2.11 (torch usunelo
# Sampler.__init__ -> lhotse `super().__init__(data_source=None)` trafia w
# object.__init__). lhotse 1.33.0 to naprawia i nadal dziala z NeMo 2.6.2.
force_pins = ["lhotse==1.33.0"]

[[install_variants]]
backend = "rocm"
extra_index = "https://download.pytorch.org/whl/rocm7.0"
extras = ["torch==2.11.0", "torchaudio==2.11.0", "nemo_toolkit[asr]==2.6.2"]
force_pins = ["lhotse==1.33.0"]
install_hint = "experimental"
