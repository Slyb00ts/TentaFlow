# =============================================================================
# Plik: reranker/_services/qwen3-rerank-mlx.toml
# Opis: Reranker Qwen3 (MLX) na Apple Silicon — python-bundle z serwerem
#       /v1/rerank (server.py liczy score yes/no z modelu przez mlx-lm).
#       Apache-2.0. mlx-lm laduje Qwen/Qwen3-Reranker-0.6B i konwertuje wagi do
#       MLX w runtime. iOS nie jest wspierany (python-bundle dziala na macOS).
# =============================================================================

[engine]
id = "qwen3-rerank-mlx"
provider = "tentaflow"
category = "reranker"
name = "Qwen3 Reranker (MLX)"
description_pl = "Reranker Qwen3 na Apple Silicon (MLX) przez mlx-lm. Serwuje /v1/rerank na macOS. Apache-2.0. Score yes/no liczony z modelu."
description_en = "Qwen3 reranker on Apple Silicon (MLX) via mlx-lm. Serves /v1/rerank on macOS. Apache-2.0. yes/no score computed from the model."
homepage = "https://huggingface.co/Qwen/Qwen3-Reranker-0.6B"
license = "Apache-2.0"
icon = "mlx"
default_port = 8000
api = "openai-compatible"
version = "v3"
service_surfaces = ["rerank"]
input_modalities = ["text"]

[deploy.native]
platforms = ["macos"]
runtime = "python-bundle"
bundle_path = "reranker/python/qwen3-rerank-mlx"

[[model_preset]]
id = "qwen3-reranker-0-6b-mlx"
display_name = "Qwen3 Reranker 0.6B (MLX)"
repo = "Qwen/Qwen3-Reranker-0.6B"
recommended = true
