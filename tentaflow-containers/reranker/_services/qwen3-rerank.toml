# =============================================================================
# Plik: reranker/_services/qwen3-rerank.toml
# Opis: Reranker Qwen3 (cross-encoder) serwowany przez vLLM (--task score).
#       Apache-2.0, czysty komercyjnie. Wystawia OpenAI-compatible /v1/rerank +
#       /v1/score. Warianty GGUF (`qwen3-rerank-gguf`) i MLX (`qwen3-rerank-mlx`)
#       pokrywaja CPU/AMD/telefon i Apple Silicon. vLLM laduje model w trybie
#       sequence-classification (hf_overrides przekazuje Core w argach silnika).
# =============================================================================

[engine]
id = "qwen3-rerank"
provider = "tentaflow"
category = "reranker"
name = "Qwen3 Reranker"
description_pl = "Reranker Qwen3 (cross-encoder) przez vLLM (--task score). Apache-2.0. Ranguje pasaze wzgledem zapytania. GGUF: qwen3-rerank-gguf, Apple: qwen3-rerank-mlx."
description_en = "Qwen3 reranker (cross-encoder) via vLLM (--task score). Apache-2.0. Ranks passages against a query. GGUF: qwen3-rerank-gguf, Apple: qwen3-rerank-mlx."
homepage = "https://huggingface.co/Qwen/Qwen3-Reranker-0.6B"
license = "Apache-2.0"
icon = "vllm"
default_port = 8000
api = "openai-compatible"
version = "v3"
service_surfaces = ["rerank"]
input_modalities = ["text"]
dgx_spark = false

[deploy.docker]
context_path = "reranker/docker/qwen3-rerank"
platforms = ["linux", "windows"]
transport = "direct-http"

[deploy.native]
platforms = ["linux", "windows"]
runtime = "python-bundle"
bundle_path = "reranker/python/qwen3-rerank"

[[model_preset]]
id = "qwen3-reranker-0-6b"
display_name = "Qwen3 Reranker 0.6B"
repo = "Qwen/Qwen3-Reranker-0.6B"
recommended = true

[[model_preset]]
id = "qwen3-reranker-4b"
display_name = "Qwen3 Reranker 4B"
repo = "Qwen/Qwen3-Reranker-4B"
