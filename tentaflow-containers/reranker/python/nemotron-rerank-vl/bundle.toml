# =============================================================================
# Plik: reranker/python/nemotron-rerank-vl/bundle.toml
# Opis: NVIDIA Llama-Nemotron Rerank VL jako natywny bundle vLLM (PyPI, pinned
#       0.28.0). Multimodalny cross-encoder (Eagle VLM: Llama 3.2 1B + SigLIP2)
#       serwowany w trybie score/rerank; wystawia /v1/rerank + /v1/score dla
#       tekstu i obrazow. CUDA (cu130) i ROCm (rocm7.0).
# =============================================================================

[bundle]
engine = "nemotron-rerank-vl"
description = "NVIDIA Llama-Nemotron Rerank VL multimodal cross-encoder via vLLM (PyPI, pinned 0.28.0)"
python_version = "3.12"
source = "pypi"
pypi_package = "vllm==0.28.0"

[launch]
command = "python"
# Bundle dostarcza identity flags (model + transport) i baseline defaults.
# --task score wlacza tryb cross-encoder vLLM (endpointy /v1/rerank + /v1/score).
# --trust-remote-code wymagane dla Eagle VLM (wlasny kod modelu w repo HF).
# --served-model-name = preset id (slug po ktorym core routuje), nie repo path.
args = [
    "-m", "vllm.entrypoints.openai.api_server",
    "--host", "127.0.0.1",
    "--port", "${PORT:-8000}",
    "--model", "${MODEL}",
    "--served-model-name", "${SERVED_MODEL_NAME}",
    "--trust-remote-code",
    "--dtype", "auto",
    "--max-model-len", "${MAX_MODEL_LEN:-8192}",
]
internal_port = 8000

[requires]
gpu_memory_gb = 8
disk_gb = 14
platforms = ["linux-x86_64", "linux-aarch64", "windows-x86_64"]

# vLLM wymaga jawnego wheela +cu130 dla B300 (sm_103) — domyslny PyPI to cu129
# i nie ma optymalizacji Blackwell. extra_index wskazuje nightly cu130 vLLM;
# torch tez idzie z cu130 (Dockerfile pobiera go z download.pytorch.org/whl/cu130).
[[install_variants]]
backend = "cuda"
extra_index = "https://wheels.vllm.ai/nightly/cu130"
extras = []

[[install_variants]]
backend = "rocm"
extra_index = "https://wheels.vllm.ai/rocm/"
extras = []
install_hint = "VLLM_TARGET_DEVICE=rocm"
