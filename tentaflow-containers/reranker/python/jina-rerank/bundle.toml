# =============================================================================
# Plik: reranker/python/jina-rerank/bundle.toml
# Opis: jina-reranker-v3 jako natywny bundle vLLM (PyPI, pinned 0.25.1). vLLM
#       serwuje reranker w trybie score i wystawia OpenAI-compatible /v1/rerank +
#       /v1/score. CUDA (cu130) i ROCm (rocm7.0). v3 jest listwise — zweryfikuj
#       jakosc rankingu po deployu (patrz naglowek manifestu jina-rerank.toml).
# =============================================================================

[bundle]
engine = "jina-rerank"
description = "jina-reranker-v3 via vLLM (PyPI, pinned 0.25.1, --task score)"
python_version = "3.12"
source = "pypi"
pypi_package = "vllm==0.25.1"

[launch]
command = "python"
# --task score wlacza tryb reranking vLLM (endpointy /v1/rerank + /v1/score).
# --trust-remote-code bo repo Jina dostarcza wlasny kod architektury.
# --served-model-name = preset id (slug po ktorym core routuje), nie repo path.
args = [
    "-m", "vllm.entrypoints.openai.api_server",
    "--host", "127.0.0.1",
    "--port", "${PORT:-8000}",
    "--model", "${MODEL}",
    "--task", "score",
    "--served-model-name", "${SERVED_MODEL_NAME}",
    "--trust-remote-code",
    "--dtype", "auto",
    "--max-model-len", "${MAX_MODEL_LEN:-8192}",
]
internal_port = 8000

[requires]
gpu_memory_gb = 2
disk_gb = 6
platforms = ["linux-x86_64", "linux-aarch64", "windows-x86_64"]

[[install_variants]]
backend = "cuda"
extra_index = "https://wheels.vllm.ai/nightly/cu130"
extras = []

[[install_variants]]
backend = "rocm"
extra_index = "https://download.pytorch.org/whl/rocm7.0"
extras = []
install_hint = "VLLM_TARGET_DEVICE=rocm"
