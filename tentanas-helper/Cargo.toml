[package]
name = "tentanas-helper"
version = "0.3.0"
edition = "2021"
authors = ["TentaFlow"]
description = "TentaNas privilege channel: the typed command catalog shared with core and the root-side wrapper that executes it"

[lib]
name = "tentanas_helper"
path = "src/lib.rs"

[[bin]]
name = "tentanas-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
libc = "0.2.186"
