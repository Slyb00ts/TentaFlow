[package]
name = "tentanas-helper"
version = "0.12.0"
edition = "2021"
authors = ["TentaFlow"]
description = "TentaNas privilege channel: the typed command catalog shared with core and the root-side wrapper that executes it"

[lib]
name = "tentanas_helper"
path = "src/lib.rs"

[[bin]]
name = "tentanas-helper"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = true }
libc = { workspace = true }
sha2 = { workspace = true }
